name: Android Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'ops/android-emulator-smoke-trigger.txt'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator install and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.zerotoempire.game
            adb logcat -c
            adb shell am start -W -n com.zerotoempire.game/.MainActivity | tee /tmp/am-start.txt
            grep -Eq 'Status: ok|Complete' /tmp/am-start.txt
            sleep 8
            pid="$(adb shell pidof com.zerotoempire.game | tr -d '\r')"
            test -n "$pid"
            echo "APP_PID=$pid"
            adb shell dumpsys activity activities | grep -F 'com.zerotoempire.game/.MainActivity'
            adb shell dumpsys window windows | grep -F 'com.zerotoempire.game'
            adb exec-out screencap -p > /tmp/zero-to-empire-smoke.png
            adb logcat -d > /tmp/zero-to-empire-logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.zerotoempire\.game.*has died' /tmp/zero-to-empire-logcat.txt; then
              echo "::error::Fatal Android runtime crash detected"
              exit 1
            fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-evidence
          path: |
            /tmp/am-start.txt
            /tmp/zero-to-empire-smoke.png
            /tmp/zero-to-empire-logcat.txt
          if-no-files-found: warn
          retention-days: 14
