name: Update manifest count temporary

on:
  push:
    branches:
      - art/onboarding-authored-target-00
    paths:
      - .github/workflows/update-manifest-count-temp.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: art/onboarding-authored-target-00
      - name: Update authoritative denominator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          s=p.read_text(encoding='utf-8')
          old='**Total final deliverables: 235** = 98 building masters + 7 Power Core + 24 character sheets + 18 vehicle sprites/sheets + 28 machine sheets + 28 prop sprites + 14 terrain/infrastructure sprites + 18 FX sheets.'
          new='**Total final deliverables: 236** = 98 building masters + 7 Power Core + 24 character sheets + 18 vehicle sprites/sheets + 28 machine sheets + 28 prop sprites + 14 terrain/infrastructure sprites + 18 FX sheets + 1 onboarding illustration.'
          if old not in s:
              raise SystemExit('locked-scope denominator line not found')
          s=s.replace(old,new,1)
          ledger='- **DONE: 125 / 235**'
          if ledger in s:
              s=s.replace(ledger,'- **DONE: 125 / 236**',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art/FINAL_AAA_SPRITE_MANIFEST.md
          git commit -m 'docs(art): count onboarding authored target'
          git push origin HEAD:art/onboarding-authored-target-00
