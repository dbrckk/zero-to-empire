name: Instant Small FX Batch (manual repair)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instant-small-fx-batch
  cancel-in-progress: true

jobs:
  author-finalize:
    name: Author and finalize FX-00 through FX-03
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SPRITE_TARGETS: FX-00,FX-01,FX-02,FX-03
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==11.3.0'

      - name: Generate and validate all four in one process
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/procedural_fx_factory.py
          for n in 00 01 02 03; do
            test -s "art/incoming/final-sprites/zte_fx_${n}_final.png"
          done

      - name: Finalize all four once
        run: python tools/sprites/process_final_sprites.py

      - name: Commit only when repair changed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/incoming/final-sprites/ app/src/main/res/drawable-nodpi/
          if git diff --cached --quiet; then
            echo 'No small-FX repair changes.'
          else
            git commit -m 'art: repair FX-00 through FX-03 batch'
            git push
          fi

      - name: Upload finalized batch for visual inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finalized-FX-00-FX-03
          path: |
            art/incoming/final-sprites/zte_fx_0[0-3]_final.png
            app/src/main/res/drawable-nodpi/zte_fx_0[0-3]_final.webp
          if-no-files-found: error
          retention-days: 30
