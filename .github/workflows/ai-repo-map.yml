name: Repository standards

on:
  push:
    branches: [main]
    paths-ignore:
      - ".ai/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-standards-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-standards:
    uses: dbrckk/repo-standards/.github/workflows/reusable-unified.yml@main
    with:
      # The complete published asset pipeline and Play release tooling now
      # produce a measured ~1.80 MB source map. Keep a bounded 2 MB cap;
      # do not relax shared repository standards for unrelated repositories.
      ai_map_max_bytes: 2000000

  strict-review-backlog:
    name: Strict review backlog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated strict-review backlog
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sprites/generate_strict_review_backlog.py
          git diff --exit-code -- art/production/character-strict-review-backlog.md
