name: Manifest Static GPU Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manifest-static-gpu-batch.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: manifest-static-gpu-batch
  cancel-in-progress: true

jobs:
  produce:
    name: Generate up to 12 props
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_URL: https://mcp-tools-z-image-turbo.hf.space
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - id: batch
        name: Generate validated prop batch
        shell: bash
        run: |
          set -u -o pipefail
          python3 tools/sprites/manifest_batch_planner.py --kind PRP --count 12 > /tmp/plan.json
          python3 - <<'PY' > /tmp/targets.tsv
          import json
          with open('/tmp/plan.json', encoding='utf-8') as f:
              for item in json.load(f)['include']:
                  print(f"{item['id']}\t{item['stem']}")
          PY

          successes=()
          while IFS=$'\t' read -r asset_id stem; do
            [ -n "$asset_id" ] || continue
            echo "=== $asset_id ==="
            set +e
            SPRITE_TARGET="$asset_id" python3 tools/sprites/hf_static_manifest_factory.py
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -s "art/incoming/final-sprites/${stem}.png" ]; then
              successes+=("$stem")
              continue
            fi
            if [ "$rc" -eq 75 ]; then
              echo 'Free GPU quota exhausted; preserving successful candidates.'
              break
            fi
            echo "Rejected $asset_id (rc=$rc); continuing."
          done < /tmp/targets.tsv

          echo "successful_assets=${#successes[@]}"
          if (( ${#successes[@]} == 0 )); then
            echo 'has_files=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stems="$(IFS=,; echo "${successes[*]}")"
          echo "SPRITE_TARGETS=$stems" >> "$GITHUB_ENV"
          echo 'has_files=true' >> "$GITHUB_OUTPUT"

      - name: Finalize successful candidates
        if: steps.batch.outputs.has_files == 'true'
        run: python3 tools/sprites/process_final_sprites.py

      - name: Commit validated batch
        if: steps.batch.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/incoming/final-sprites/ app/src/main/res/drawable-nodpi/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'art: finalize massive prop batch'
          git pull --rebase origin main
          git push

      - name: Upload inspection artifact
        if: steps.batch.outputs.has_files == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finalized-prop-batch
          path: |
            art/incoming/final-sprites/zte_prop_*_final.png
            app/src/main/res/drawable-nodpi/zte_prop_*_final.webp
          if-no-files-found: error
          retention-days: 30
