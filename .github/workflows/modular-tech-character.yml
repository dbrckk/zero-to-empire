name: Modular TECH walk (review only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sprites/rigged_tech_walk_v2.py'
      - 'tools/sprites/test_rigged_tech_walk_v2.py'
      - 'tools/sprites/skin-tech-v1.webp'
      - '.github/workflows/modular-tech-character.yml'

permissions:
  contents: read

jobs:
  build-review-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Test geometry and enforce review gate
        run: python -m unittest discover -s tools/sprites -p 'test_rigged_tech_walk_v2.py' -v
      - name: Build 24 transparent frames and motion QA
        run: |
          python tools/sprites/rigged_tech_walk_v2.py \
            --skin tools/sprites/skin-tech-v1.webp \
            --output build/tech-walk-modular-v2 --frames 24 --fps 12
      - name: Upload review candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-walk-modular-v2-REVIEW_REQUIRED
          path: |
            build/tech-walk-modular-v2/
            build/CHR-TECH-WALK-modular-v2-review.zip
          if-no-files-found: warn
          retention-days: 30
