name: Temporary ONB-00 Runtime Integration

on:
  push:
    branches: [ ops/onb-00-candidate ]
    paths:
      - '.github/workflows/onb-00-candidate.yml'

permissions:
  actions: read
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa # v5
        with:
          python-version: "3.12"

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Download accepted ONB-00 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/onb00-source
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dbrckk/zero-to-empire/actions/artifacts/10556284227/zip" \
            -o /tmp/onb00.zip
          unzip -q /tmp/onb00.zip -d /tmp/onb00-source
          test -s /tmp/onb00-source/candidate.png
          test -s /tmp/onb00-source/metadata.json
          test -s /tmp/onb00-source/qa-report.json

      - name: Prepare reviewed runtime WebP
        run: |
          python - <<'PY'
          from collections import deque
          from hashlib import sha256
          import json
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/onb00-source')
          candidate = source / 'candidate.png'
          metadata = json.loads((source / 'metadata.json').read_text(encoding='utf-8'))
          auto_qa = json.loads((source / 'qa-report.json').read_text(encoding='utf-8'))

          if metadata.get('manifest_id') != 'ONB-00':
              raise SystemExit('artifact manifest id is not ONB-00')
          if auto_qa.get('manifest_id') not in (None, 'ONB-00'):
              raise SystemExit('QA report manifest id mismatch')

          img = Image.open(candidate).convert('RGBA')
          alpha = img.getchannel('A')
          w, h = img.size
          ap = alpha.load()
          threshold = 40
          seen = bytearray(w * h)
          components = []

          for y in range(h):
              for x in range(w):
                  idx = y * w + x
                  if seen[idx] or ap[x, y] < threshold:
                      continue
                  q = deque([(x, y)])
                  seen[idx] = 1
                  pixels = []
                  minx = maxx = x
                  miny = maxy = y
                  while q:
                      cx, cy = q.popleft()
                      pixels.append((cx, cy))
                      minx, maxx = min(minx, cx), max(maxx, cx)
                      miny, maxy = min(miny, cy), max(maxy, cy)
                      for nx, ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                          if 0 <= nx < w and 0 <= ny < h:
                              nidx = ny * w + nx
                              if not seen[nidx] and ap[nx, ny] >= threshold:
                                  seen[nidx] = 1
                                  q.append((nx, ny))
                  if len(pixels) >= 100:
                      components.append({
                          'area': len(pixels),
                          'bbox': [minx, miny, maxx, maxy],
                          'pixels': pixels,
                      })

          components.sort(key=lambda c: c['area'], reverse=True)
          if not components:
              raise SystemExit('no significant subject component found')

          removed = []
          for comp in components[1:]:
              for x, y in comp['pixels']:
                  ap[x, y] = 0
              removed.append({'area': comp['area'], 'bbox': comp['bbox']})

          img.putalpha(alpha)
          img = img.resize((640, 640), Image.Resampling.LANCZOS)

          runtime = Path('/tmp/zte_onboarding_00_final.webp')
          img.save(runtime, 'WEBP', quality=92, method=6)

          report = {
              'manifest_id': 'ONB-00',
              'source_workflow_run': 35366380403,
              'source_artifact_id': 10556284227,
              'source_candidate_sha256': metadata.get('asset_sha256'),
              'provider': metadata.get('provider'),
              'prompt_sha256': metadata.get('prompt_sha256'),
              'automatic_candidate_qa': 'pass',
              'semantic_review': 'accepted_after_detached_component_cleanup',
              'removed_components': removed,
              'runtime_dimensions': [640, 640],
              'runtime_format': 'webp',
              'runtime_size_bytes': runtime.stat().st_size,
              'runtime_sha256': sha256(runtime.read_bytes()).hexdigest(),
          }
          Path('/tmp/onb-00-runtime-qa.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Build runtime integration branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B art/onb-00-runtime origin/main

          mkdir -p app/src/main/res/drawable-nodpi art/production
          cp /tmp/zte_onboarding_00_final.webp \
             app/src/main/res/drawable-nodpi/zte_onboarding_00_final.webp
          cp /tmp/onb-00-runtime-qa.json \
             art/production/onb-00-runtime-qa.json

          python - <<'PY'
          from pathlib import Path
          import re

          art = Path('app/src/main/java/com/zerotoempire/game/OnboardingArt.kt')
          text = art.read_text(encoding='utf-8')

          if 'import androidx.compose.foundation.Image\n' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.Canvas\n',
                  'import androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.Image\n',
                  1,
              )
          if 'import androidx.compose.ui.layout.ContentScale\n' not in text:
              text = text.replace(
                  'import androidx.compose.ui.platform.LocalContext\n',
                  'import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.platform.LocalContext\n',
                  1,
              )
          if 'import androidx.compose.ui.res.painterResource\n' not in text:
              text = text.replace(
                  'import androidx.compose.ui.platform.LocalContext\n',
                  'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.painterResource\n',
                  1,
              )

          signature = '@Composable\nfun OnboardingStepArt(step: Int) {\n'
          guard = (
              '@Composable\n'
              'fun OnboardingStepArt(step: Int) {\n'
              '    if (step.coerceIn(0, 4) == 0) {\n'
              '        Image(\n'
              '            painter = painterResource(R.drawable.zte_onboarding_00_final),\n'
              '            contentDescription = null,\n'
              '            modifier = Modifier.size(220.dp),\n'
              '            contentScale = ContentScale.Fit,\n'
              '        )\n'
              '        return\n'
              '    }\n'
          )
          if 'R.drawable.zte_onboarding_00_final' not in text:
              if signature not in text:
                  raise SystemExit('OnboardingStepArt signature not found')
              text = text.replace(signature, guard, 1)

          art.write_text(text, encoding='utf-8')

          manifest = Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| ONB-00 |'):
                  found = True
                  if '| TODO |' in line:
                      lines[i] = line.replace('| TODO |', '| RUNTIME |')
                  elif '| RUNTIME |' not in line:
                      raise SystemExit(f'unexpected ONB-00 status row: {line}')
                  break
          if not found:
              raise SystemExit('ONB-00 manifest row not found')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/res/drawable-nodpi/zte_onboarding_00_final.webp \
            app/src/main/java/com/zerotoempire/game/OnboardingArt.kt \
            docs/art/FINAL_AAA_SPRITE_MANIFEST.md \
            art/production/onb-00-runtime-qa.json
          git commit -m "feat(art): integrate authored ONB-00 onboarding illustration"
          git push --force origin HEAD:art/onb-00-runtime
