name: Asset Pipeline CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/assets/**'
      - 'tools/sprites/audit_complete_sprite_manifest.py'
      - 'tools/sprites/asset_queue_utils.py'
      - 'tools/sprites/asset_wave_orchestrator.py'
      - 'tools/sprites/animation_batch_planner.py'
      - 'tools/sprites/build_character_review_panels.py'
      - 'tools/sprites/character_head_identity_lock.py'
      - 'tools/sprites/character_approved_idle_fallback.py'
      - 'tools/sprites/test_character_approved_idle_fallback.py'
      - 'tools/sprites/character_ground_shadow_cleanup.py'
      - 'tools/sprites/character_anchor_pair_salvage.py'
      - 'tools/sprites/character_rejection_evidence.py'
      - 'tools/sprites/test_character_rejection_evidence.py'
      - 'tools/sprites/test_character_anchor_pair_salvage.py'
      - 'tools/sprites/test_character_ground_shadow_cleanup.py'
      - 'tools/sprites/test_character_head_identity_lock.py'
      - 'tools/sprites/character_semantic_gate.py'
      - 'tools/sprites/test_character_semantic_gate.py'
      - 'tools/sprites/test_character_action_gate.py'
      - 'tools/sprites/test_animation_batch_planner.py'
      - 'tools/sprites/kaggle_*factory*.py'
      - 'kaggle/github_mass_factory.py'
      - 'art/production/generation-rejection-ledger.json'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'docs/art/UNIFIED_ASSET_PIPELINE.md'
      - '.github/workflows/asset-pipeline-ci.yml'
      - '.github/workflows/asset-autofactory.yml'
      - '.github/workflows/kaggle-mass-sprite-factory.yml'
      - '.github/workflows/kaggle-async-character-collector.yml'
      - '.github/workflows/kaggle-superseded-character-evidence.yml'
      - '.github/workflows/promote-approved-kaggle-characters.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/assets/**'
      - 'tools/sprites/audit_complete_sprite_manifest.py'
      - 'tools/sprites/asset_queue_utils.py'
      - 'tools/sprites/asset_wave_orchestrator.py'
      - 'tools/sprites/animation_batch_planner.py'
      - 'tools/sprites/build_character_review_panels.py'
      - 'tools/sprites/character_head_identity_lock.py'
      - 'tools/sprites/character_approved_idle_fallback.py'
      - 'tools/sprites/test_character_approved_idle_fallback.py'
      - 'tools/sprites/character_ground_shadow_cleanup.py'
      - 'tools/sprites/character_anchor_pair_salvage.py'
      - 'tools/sprites/character_rejection_evidence.py'
      - 'tools/sprites/test_character_rejection_evidence.py'
      - 'tools/sprites/test_character_anchor_pair_salvage.py'
      - 'tools/sprites/test_character_ground_shadow_cleanup.py'
      - 'tools/sprites/test_character_head_identity_lock.py'
      - 'tools/sprites/character_semantic_gate.py'
      - 'tools/sprites/test_character_semantic_gate.py'
      - 'tools/sprites/test_character_action_gate.py'
      - 'tools/sprites/test_animation_batch_planner.py'
      - 'tools/sprites/kaggle_*factory*.py'
      - 'kaggle/github_mass_factory.py'
      - 'art/production/generation-rejection-ledger.json'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'docs/art/UNIFIED_ASSET_PIPELINE.md'
      - '.github/workflows/asset-pipeline-ci.yml'
      - '.github/workflows/asset-autofactory.yml'
      - '.github/workflows/kaggle-mass-sprite-factory.yml'
      - '.github/workflows/kaggle-async-character-collector.yml'
      - '.github/workflows/kaggle-superseded-character-evidence.yml'
      - '.github/workflows/promote-approved-kaggle-characters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa # v5
        with:
          python-version: '3.12'

      - name: Install manifest audit dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Compile production sprite generators
        run: |
          python -m py_compile \
            kaggle/github_mass_factory.py \
            tools/sprites/asset_queue_utils.py \
            tools/sprites/asset_wave_orchestrator.py \
            tools/sprites/build_character_review_panels.py \
            tools/sprites/character_head_identity_lock.py \
            tools/sprites/character_approved_idle_fallback.py \
            tools/sprites/character_ground_shadow_cleanup.py \
            tools/sprites/character_anchor_pair_salvage.py \
            tools/sprites/character_rejection_evidence.py \
            tools/sprites/kaggle_character_sheet_factory_v1.py \
            tools/sprites/kaggle_building_family_factory_v14.py \
            tools/sprites/kaggle_building_family_factory_v15.py \
            tools/sprites/kaggle_building_family_factory_v16.py \
            tools/sprites/kaggle_building_family_factory_v16_10.py \
            tools/sprites/kaggle_building_family_factory_v17.py

      - name: Exercise role review panels with a real rendered atlas
        run: |
          set -euo pipefail
          mkdir -p /tmp/zte-smoke-candidates /tmp/zte-smoke-review
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          atlas=Image.new('RGBA',(1024,1024),(0,0,0,0))
          draw=ImageDraw.Draw(atlas)
          for index in range(6):
              x=(index%4)*256
              y=(index//4)*256
              draw.ellipse((x+105,y+30,x+151,y+76),fill=(175,123,90,255))
              draw.rounded_rectangle((x+88,y+76,x+166,y+170),radius=14,fill=(58,73,91,255))
              draw.line((x+106,y+170,x+98,y+226),fill=(58,73,91,255),width=18)
              draw.line((x+149,y+170,x+160,y+226),fill=(58,73,91,255),width=18)
          atlas.save('/tmp/zte-smoke-candidates/zte_chr_op_idle_final.png')
          PY
          python tools/sprites/build_character_review_panels.py \
            --candidates /tmp/zte-smoke-candidates \
            --output-dir /tmp/zte-smoke-review
          test -s /tmp/zte-smoke-review/review-frames-op.png
          test -s /tmp/zte-smoke-review/review-heads-op.png
          test -s /tmp/zte-smoke-review/review-mobile-op-idle.png
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/zte-smoke-review/review-panels.json').read_text())
          assert d['review_only'] is True
          assert d['roles'][0]['automatically_approved'] is False
          assert d['roles'][0]['head_detail_file']=='review-heads-op.png'
          idle=d['roles'][0]['actions']['idle']
          assert idle['candidate'] is True
          visual=idle['image_only_risk']
          assert visual['image_only_semantic_approval'] is False
          assert visual['risk_level'] in {'BLOCKING','REVIEW','NOT_DETECTED'}
          timing=idle['temporal_evidence']
          assert timing['status']=='REVIEW_ONLY'
          assert timing['automatic_semantic_approval'] is False
          assert 'last_to_first_alpha_change' in timing
          assert 'loop_seam_to_mean_step_ratio' in timing
          assert d['roles'][0]['mobile_action_files']['idle']=='review-mobile-op-idle.png'
          from PIL import Image
          mobile=Image.open('/tmp/zte-smoke-review/review-mobile-op-idle.png')
          assert mobile.width<700 and mobile.height>900
          print('CHARACTER_REVIEW_PANEL_SMOKE_PASS=1')
          PY

      - name: Validate rejection-memory schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/production/generation-rejection-ledger.json')
          d=json.loads(p.read_text())
          assert d.get('schema_version')==1
          rows=d.get('entries')
          assert isinstance(rows,list) and rows
          for i,row in enumerate(rows):
              assert isinstance(row.get('reason'),str) and row['reason'].strip(), i
              assert isinstance(row.get('prompt_hint'),str) and row['prompt_hint'].strip(), i
              assert row.get('target_prefix') or row.get('role'), i
          print(f"REJECTION_MEMORY_SCHEMA_PASS={len(rows)}")
          PY

      - name: Run unified asset pipeline and visual-semantic gate checks
        run: |
          python -m unittest discover -s tools/assets -p 'test_*.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_semantic_gate.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_head_identity_lock.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_approved_idle_fallback.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_ground_shadow_cleanup.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_anchor_pair_salvage.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_rejection_evidence.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_action_gate.py' -v

      - name: Verify live character-production plan against strict queue and Android frame contract
        run: |
          python -m unittest discover -s tools/sprites -p 'test_animation_batch_planner.py' -v
          python tools/sprites/animation_batch_planner.py --kind CHR --count 16 > /tmp/character-animation-batch.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/character-animation-batch.json'))
          assert report['approved_by_planner']==0
          assert report['strict_count_increased'] is False
          assert report['regeneration_count']+report['semantic_review_count']<=report['unresolved_count']
          assert all(not x['automatic_promotion_permitted'] for x in report['include'])
          print('ANIMATION_BATCH_PLAN_SAFE=1 unresolved='+str(report['unresolved_count']))
          PY

      - name: Audit authoritative sprite manifest
        run: python tools/sprites/audit_complete_sprite_manifest.py --allow-pending
