name: Asset Pipeline CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/assets/**'
      - 'tools/sprites/audit_complete_sprite_manifest.py'
      - 'tools/sprites/asset_queue_utils.py'
      - 'tools/sprites/asset_wave_orchestrator.py'
      - 'tools/sprites/animation_batch_planner.py'
      - 'tools/sprites/build_character_review_panels.py'
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_material_finish.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_action_fx.py'
      - 'tools/sprites/render_original_character_previews.py'
      - 'art/incoming/chatgpt-original/**'
      - 'tools/sprites/verify_local_character_bundle.py'
      - 'tools/sprites/character_head_identity_lock.py'
      - 'tools/sprites/character_approved_idle_fallback.py'
      - 'tools/sprites/test_character_approved_idle_fallback.py'
      - 'tools/sprites/character_ground_shadow_cleanup.py'
      - 'tools/sprites/character_anchor_pair_salvage.py'
      - 'tools/sprites/character_rejection_evidence.py'
      - 'tools/sprites/character_idle_breathing_fallback.py'
      - 'tools/sprites/test_character_rejection_evidence.py'
      - 'tools/sprites/test_character_anchor_pair_salvage.py'
      - 'tools/sprites/test_character_ground_shadow_cleanup.py'
      - 'tools/sprites/test_character_head_identity_lock.py'
      - 'tools/sprites/character_semantic_gate.py'
      - 'tools/sprites/verify_character_action_candidates.py'
      - 'tools/sprites/test_verify_character_action_candidates.py'
      - 'tools/sprites/test_character_semantic_gate.py'
      - 'tools/sprites/verify_character_idle_candidates.py'
      - 'tools/sprites/test_verify_character_idle_candidates.py'
      - 'tools/sprites/test_character_action_gate.py'
      - 'tools/sprites/test_animation_batch_planner.py'
      - 'tools/sprites/kaggle_*factory*.py'
      - 'kaggle/github_mass_factory.py'
      - 'art/production/generation-rejection-ledger.json'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'docs/art/UNIFIED_ASSET_PIPELINE.md'
      - 'art/production/LOCAL_FIRST_CHARACTER_HANDOFF.md'
      - '.github/workflows/asset-pipeline-ci.yml'
      - '.github/workflows/asset-autofactory.yml'
      - '.github/workflows/kaggle-mass-sprite-factory.yml'
      - '.github/workflows/kaggle-async-character-collector.yml'
      - '.github/workflows/local-character-review.yml'
      - '.github/workflows/kaggle-superseded-character-evidence.yml'
      - '.github/workflows/promote-approved-kaggle-characters.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/assets/**'
      - 'tools/sprites/audit_complete_sprite_manifest.py'
      - 'tools/sprites/asset_queue_utils.py'
      - 'tools/sprites/asset_wave_orchestrator.py'
      - 'tools/sprites/animation_batch_planner.py'
      - 'tools/sprites/build_character_review_panels.py'
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_material_finish.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_action_fx.py'
      - 'tools/sprites/render_original_character_previews.py'
      - 'art/incoming/chatgpt-original/**'
      - 'tools/sprites/verify_local_character_bundle.py'
      - 'tools/sprites/character_head_identity_lock.py'
      - 'tools/sprites/character_approved_idle_fallback.py'
      - 'tools/sprites/test_character_approved_idle_fallback.py'
      - 'tools/sprites/character_ground_shadow_cleanup.py'
      - 'tools/sprites/character_anchor_pair_salvage.py'
      - 'tools/sprites/character_rejection_evidence.py'
      - 'tools/sprites/character_idle_breathing_fallback.py'
      - 'tools/sprites/test_character_rejection_evidence.py'
      - 'tools/sprites/test_character_anchor_pair_salvage.py'
      - 'tools/sprites/test_character_ground_shadow_cleanup.py'
      - 'tools/sprites/test_character_head_identity_lock.py'
      - 'tools/sprites/character_semantic_gate.py'
      - 'tools/sprites/verify_character_action_candidates.py'
      - 'tools/sprites/test_verify_character_action_candidates.py'
      - 'tools/sprites/test_character_semantic_gate.py'
      - 'tools/sprites/verify_character_idle_candidates.py'
      - 'tools/sprites/test_verify_character_idle_candidates.py'
      - 'tools/sprites/test_character_action_gate.py'
      - 'tools/sprites/test_animation_batch_planner.py'
      - 'tools/sprites/kaggle_*factory*.py'
      - 'kaggle/github_mass_factory.py'
      - 'art/production/generation-rejection-ledger.json'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'docs/art/UNIFIED_ASSET_PIPELINE.md'
      - 'art/production/LOCAL_FIRST_CHARACTER_HANDOFF.md'
      - '.github/workflows/asset-pipeline-ci.yml'
      - '.github/workflows/asset-autofactory.yml'
      - '.github/workflows/kaggle-mass-sprite-factory.yml'
      - '.github/workflows/kaggle-async-character-collector.yml'
      - '.github/workflows/local-character-review.yml'
      - '.github/workflows/kaggle-superseded-character-evidence.yml'
      - '.github/workflows/promote-approved-kaggle-characters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa # v5
        with:
          python-version: '3.12'

      - name: Install manifest audit dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Compile production sprite generators
        run: |
          python -m py_compile \
            kaggle/github_mass_factory.py \
            tools/sprites/asset_queue_utils.py \
            tools/sprites/asset_wave_orchestrator.py \
            tools/sprites/build_character_review_panels.py \
            tools/sprites/render_chatgpt_originals.py \
            tools/sprites/local_character_material_finish.py \
            tools/sprites/local_character_action_fx.py \
            tools/sprites/local_character_contact_gait.py \
            tools/sprites/render_original_character_previews.py \
            tools/sprites/verify_local_character_bundle.py \
            tools/sprites/character_head_identity_lock.py \
            tools/sprites/verify_character_action_candidates.py \
            tools/sprites/verify_character_idle_candidates.py \
            tools/sprites/character_approved_idle_fallback.py \
            tools/sprites/character_ground_shadow_cleanup.py \
            tools/sprites/character_anchor_pair_salvage.py \
            tools/sprites/character_rejection_evidence.py \
            tools/sprites/character_idle_breathing_fallback.py \
            tools/sprites/kaggle_character_sheet_factory_v1.py \
            tools/sprites/kaggle_building_family_factory_v14.py \
            tools/sprites/kaggle_building_family_factory_v15.py \
            tools/sprites/kaggle_building_family_factory_v16.py \
            tools/sprites/kaggle_building_family_factory_v16_10.py \
            tools/sprites/kaggle_building_family_factory_v17.py

      - name: Exercise identity-preserving IDLE recovery against real sprite gates
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools/sprites')
          from PIL import Image,ImageDraw
          from character_idle_breathing_fallback import build_idle_breathing_frames
          from character_semantic_gate import clip_risk,idle_visual_activity
          base=Image.new('RGBA',(256,256))
          d=ImageDraw.Draw(base)
          d.ellipse((109,23,151,70),fill=(180,120,82,255))
          d.rounded_rectangle((91,71,167,157),radius=12,fill=(61,75,91,255))
          d.line((99,92,81,133),fill=(61,75,91,255),width=13)
          d.line((159,92,178,133),fill=(61,75,91,255),width=13)
          d.line((110,150,104,222),fill=(51,61,71,255),width=17)
          d.line((148,150,157,223),fill=(51,61,71,255),width=17)
          frames=build_idle_breathing_frames(base)
          assert len(frames)==6
          assert all(frame.size==(256,256) for frame in frames)
          assert all(frame.crop((0,0,256,70)).tobytes()==base.crop((0,0,256,70)).tobytes() for frame in frames)
          assert all(frame.crop((0,225,256,256)).tobytes()==base.crop((0,225,256,256)).tobytes() for frame in frames)
          assert idle_visual_activity(frames)>.00035
          result=clip_risk(frames,'IDLE')
          assert result['risk_level']!='BLOCKING',result['flags']
          assert result['image_only_semantic_approval'] is False
          print('IDLE_RECOVERY_TECHNICAL_SMOKE_PASS=1')
          PY

      - name: Exercise frame-varying work and repair action scaffolds
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from PIL import Image,ImageDraw
          source=Path('tools/sprites/kaggle_character_sheet_factory_v1.py').read_text()
          tree=ast.parse(source)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef)
                  and n.name=='semantic_scaffold')
          # Isolate its Pillow-only function; importing the full GPU producer
          # here would need FLUX/CUDA and cannot run on the GitHub CI runner.
          scope={'Image':Image,'ImageDraw':ImageDraw}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),
                       'semantic_scaffold','exec'),scope)
          scaffold=scope['semantic_scaffold']
          base=Image.new('RGB',(1024,1024),(217,217,217))
          draw=ImageDraw.Draw(base)
          draw.ellipse((390,95,615,310),fill=(202,137,102))
          draw.rectangle((386,315,615,710),fill=(67,82,94))
          for action in ('WORK','REPAIR'):
              frames=[scaffold(base,action,i) for i in range(10)]
              assert all(f.size==(1024,1024) for f in frames)
              assert len({f.tobytes() for f in frames}) >= 6, action
              assert frames[0].tobytes()==scaffold(base,action,0).tobytes()
              assert frames[0].getpixel((0,0))==base.getpixel((0,0))
              assert frames[0].getpixel((512,110))==base.getpixel((512,110))
              print('ACTION_SCAFFOLD_CYCLE_PASS='+action)
          PY

      - name: Exercise role review panels with a real rendered atlas
        run: |
          set -euo pipefail
          mkdir -p /tmp/zte-smoke-candidates /tmp/zte-smoke-review
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          atlas=Image.new('RGBA',(1024,1024),(0,0,0,0))
          draw=ImageDraw.Draw(atlas)
          for index in range(6):
              x=(index%4)*256
              y=(index//4)*256
              draw.ellipse((x+105,y+30,x+151,y+76),fill=(175,123,90,255))
              draw.rounded_rectangle((x+88,y+76,x+166,y+170),radius=14,fill=(58,73,91,255))
              draw.line((x+106,y+170,x+98,y+226),fill=(58,73,91,255),width=18)
              draw.line((x+149,y+170,x+160,y+226),fill=(58,73,91,255),width=18)
          atlas.save('/tmp/zte-smoke-candidates/zte_chr_op_idle_final.png')
          PY
          python tools/sprites/build_character_review_panels.py \
            --candidates /tmp/zte-smoke-candidates \
            --output-dir /tmp/zte-smoke-review
          test -s /tmp/zte-smoke-review/review-frames-op.png
          test -s /tmp/zte-smoke-review/review-heads-op.png
          test -s /tmp/zte-smoke-review/review-mobile-op-idle.png
          test -s /tmp/zte-smoke-review/review-motion-op-idle.gif
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/zte-smoke-review/review-panels.json').read_text())
          assert d['review_only'] is True
          assert d['roles'][0]['automatically_approved'] is False
          assert d['roles'][0]['head_detail_file']=='review-heads-op.png'
          idle=d['roles'][0]['actions']['idle']
          assert idle['candidate'] is True
          visual=idle['image_only_risk']
          assert visual['image_only_semantic_approval'] is False
          assert visual['risk_level'] in {'BLOCKING','REVIEW','NOT_DETECTED'}
          timing=idle['temporal_evidence']
          assert timing['status']=='REVIEW_ONLY'
          assert timing['automatic_semantic_approval'] is False
          assert 'last_to_first_alpha_change' in timing
          assert 'loop_seam_to_mean_step_ratio' in timing
          assert d['roles'][0]['mobile_action_files']['idle']=='review-mobile-op-idle.png'
          from PIL import Image
          mobile=Image.open('/tmp/zte-smoke-review/review-mobile-op-idle.png')
          assert mobile.width<700 and mobile.height>900
          anim=d['roles'][0]['animated_motion_previews']['idle']
          assert anim['file']=='review-motion-op-idle.gif'
          assert anim['review_only'] is True
          assert anim['automatic_semantic_approval'] is False
          with Image.open('/tmp/zte-smoke-review/review-motion-op-idle.gif') as gif:
              assert gif.n_frames==6
              assert gif.info['loop']==0
              assert gif.info['duration']==210
          print('CHARACTER_REVIEW_PANEL_AND_LOOP_PLAYBACK_PASS=1')
          PY

      - name: Verify fallback identity source against actual canonical OP LOG atlases
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools/sprites')
          from character_approved_idle_fallback import load_approved_idle_anchor
          manifest=Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          source=Path('art/incoming/final-sprites')
          for role in ('OP','LOG'):
              seed,reason=load_approved_idle_anchor(role,manifest,source)
              if seed is None:
                  raise SystemExit(f'{role} strictly approved IDLE fallback unusable: {reason}')
              assert seed.size==(1024,1024)
              assert seed.getpixel((0,0))==(139,139,139)
              assert seed.getpixel((512,510))!=(139,139,139)
              print(f'KAGGLE_APPROVED_IDLE_SOURCE_READY={role} {reason}')
          # Engineer IDLE must not be promoted by inference from a legacy file.
          seed,reason=load_approved_idle_anchor('ENG',manifest,source)
          assert seed is None
          print('KAGGLE_ENG_REVIEW_ONLY_REFERENCE_ENFORCED=1')
          PY

      - name: Validate locally created character candidates without strict promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path('art/incoming/chatgpt-original')
          d=json.loads((root/'creation-manifest.json').read_text())
          q=json.loads(Path('art/production/master-asset-queue.json').read_text())
          ids={a['id'] for a in d['assets']}
          outstanding={a['id'] for a in q['assets'] if a['strict_status']!='DONE' and a['id'].startswith('CHR-')}
          assert outstanding.issubset(ids), sorted(outstanding-ids)
          assert len(ids)==18
          assert d['review_only'] and d['strict_done_added']==0
          assert not any(a.get('strict_approved', False) for a in d['assets'])
          for a in d['assets']:
              with Image.open(root/'candidates'/a['file']) as image:
                  assert image.size==(1024,1024) and image.mode=='RGBA'
                  for idx in range(a['frames']):
                      alpha=image.crop(((idx%4)*256,(idx//4)*256,((idx%4)+1)*256,((idx//4)+1)*256)).getchannel('A')
                      assert alpha.getbbox() is not None
          import sys
          sys.path.insert(0,'tools/sprites')
          from validate_runtime_asset import validate
          issues=[]
          for a in d['assets']:
              result=validate(a['id'],root/'candidates'/a['file'])
              if not result['pass']:
                  issues.append((a['id'],result['issues']))
          assert not issues,issues
          print('CHATGPT_CANDIDATE_RUNTIME_GEOMETRY_QA_PASS=18')
          print('CHATGPT_ORIGINAL_CANDIDATES_VALID=18 UNRESOLVED_COVERED='+str(len(outstanding)))
          PY

      - name: Validate rejection-memory schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/production/generation-rejection-ledger.json')
          d=json.loads(p.read_text())
          assert d.get('schema_version')==1
          rows=d.get('entries')
          assert isinstance(rows,list) and rows
          for i,row in enumerate(rows):
              assert isinstance(row.get('reason'),str) and row['reason'].strip(), i
              assert isinstance(row.get('prompt_hint'),str) and row['prompt_hint'].strip(), i
              assert row.get('target_prefix') or row.get('role'), i
          print(f"REJECTION_MEMORY_SCHEMA_PASS={len(rows)}")
          PY

      - name: Run unified asset pipeline and visual-semantic gate checks
        run: |
          python -m unittest discover -s tools/assets -p 'test_*.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_semantic_gate.py' -v
          python -m unittest discover -s tools/sprites -p 'test_verify_character_idle_candidates.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_head_identity_lock.py' -v
          python -m unittest discover -s tools/sprites -p 'test_local_character_action_fx.py' -v
          python -m unittest discover -s tools/sprites -p 'test_local_character_contact_gait.py' -v
          python -m unittest discover -s tools/sprites -p 'test_verify_character_action_candidates.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_approved_idle_fallback.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_ground_shadow_cleanup.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_anchor_pair_salvage.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_rejection_evidence.py' -v
          python -m unittest discover -s tools/sprites -p 'test_character_action_gate.py' -v

      - name: Verify live character-production plan against strict queue and Android frame contract
        run: |
          python -m unittest discover -s tools/sprites -p 'test_animation_batch_planner.py' -v
          python tools/sprites/animation_batch_planner.py --kind CHR --count 16 > /tmp/character-animation-batch.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/character-animation-batch.json'))
          assert report['approved_by_planner']==0
          assert report['strict_count_increased'] is False
          assert report['regeneration_count']+report['semantic_review_count']<=report['unresolved_count']
          assert all(not x['automatic_promotion_permitted'] for x in report['include'])
          print('ANIMATION_BATCH_PLAN_SAFE=1 unresolved='+str(report['unresolved_count']))
          PY

      - name: Audit authoritative sprite manifest
        run: python tools/sprites/audit_complete_sprite_manifest.py --allow-pending
