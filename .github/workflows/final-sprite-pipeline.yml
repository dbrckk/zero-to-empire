name: Final Sprite Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'art/incoming/final-sprites/**'
      - 'tools/sprites/process_final_sprites.py'
      - '.github/workflows/final-sprite-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: final-sprite-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Detect sprite candidates
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(art/incoming/final-sprites/*.png)
          if (( ${#files[@]} == 0 )); then
            echo 'has_candidates=false' >> "$GITHUB_OUTPUT"
            echo 'No PNG candidates: pipeline configuration check only.'
          else
            echo 'has_candidates=true' >> "$GITHUB_OUTPUT"
            printf 'Found %s candidate(s).\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
          fi

      - name: Process and validate final sprite candidates
        if: steps.candidates.outputs.has_candidates == 'true'
        run: python tools/sprites/process_final_sprites.py

      - name: Audit generated runtime assets
        if: steps.candidates.outputs.has_candidates == 'true'
        run: |
          set -euo pipefail
          test -d app/src/main/res/drawable-nodpi
          count="$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name '*_final.webp' | wc -l)"
          test "$count" -gt 0
          printf 'validated_final_runtime_assets=%s\n' "$count"
          find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name '*_final.webp' -print | LC_ALL=C sort

      - name: Upload processed runtime sprites
        if: steps.candidates.outputs.has_candidates == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZeroToEmpire-final-runtime-sprites
          path: app/src/main/res/drawable-nodpi/*_final.webp
          if-no-files-found: error
          retention-days: 30
