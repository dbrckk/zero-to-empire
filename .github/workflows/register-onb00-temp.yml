name: Register ONB-00 temporary

on:
  push:
    branches:
      - art/onboarding-authored-target-00
    paths:
      - .github/workflows/register-onb00-temp.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: art/onboarding-authored-target-00
      - name: Append documented onboarding target
        shell: bash
        run: |
          set -euo pipefail
          file='docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
          if grep -q '^| ONB-00 |' "$file"; then
            echo 'ONB-00 already registered'
            exit 0
          fi
          cat >> "$file" <<'EOF'

          ## I. Onboarding authored illustrations

          | ID | Asset | Description | Runtime target | Status |
          |---|---|---|---|---|
          | ONB-00 | Onboarding step 0 primary illustration | Authored replacement for the current step-0 radial Power Core/ignition visual in `OnboardingStepArt`; isolated scene art with no baked UI text. | `app/src/main/res/drawable-nodpi/zte_onboarding_00_final.webp` | TODO |
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'feat(art): register first onboarding authored target'
          git push origin HEAD:art/onboarding-authored-target-00
