name: Identity-locked WALK alternatives (review only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sprites/identity_locked_walk_candidate.py'
      - 'tools/sprites/test_identity_locked_walk_candidate.py'
      - '.github/workflows/identity-locked-walk-review.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sprites/identity_locked_walk_candidate.py'
      - 'tools/sprites/test_identity_locked_walk_candidate.py'
      - '.github/workflows/identity-locked-walk-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-locked-walk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-four-review-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only deterministic geometry tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.3.3
      - name: Test identity locks, reproducibility and output isolation
        run: python -m unittest discover -s tools/sprites -p 'test_identity_locked_walk_candidate.py' -v
      - name: Render IDLE-source attempts independently and keep explicit failures
        run: |
          set -euo pipefail
          root=build/identity-locked-walk-review
          mkdir -p "$root/logs"
          for role in OP LOG; do
            lowercase="$(printf '%s' "$role" | tr '[:upper:]' '[:lower:]')"
            source="art/incoming/final-sprites/zte_chr_${lowercase}_idle_final.png"
            if python tools/sprites/identity_locked_walk_candidate.py \
              --role "$role" --source "$source" --out "$root" \
              > "$root/logs/${role}-idle-source.log" 2>&1; then
              echo "IDLE_SOURCE_CANDIDATE_READY=$role"
            else
              echo "$role:strict-DONE-IDLE-is-not-a-safe-WALK-reference" >> "$root/logs/rejected-reference-sources.txt"
              echo "IDLE_SOURCE_CANDIDATE_REJECTED=$role"
              tail -n 12 "$root/logs/${role}-idle-source.log"
            fi
          done
          # ENG is still unapproved, while TECH is an unrelated control role.
          # These historical WALK-source examples are only comparisons.
          for role in ENG TECH; do
            if python tools/sprites/identity_locked_walk_candidate.py \
              --role "$role" --out "$root" \
              > "$root/logs/${role}-legacy-walk-source.log" 2>&1; then
              echo "LEGACY_CONTROL_CANDIDATE_READY=$role"
            else
              echo "$role:legacy-comparison-failed" >> "$root/logs/rejected-reference-sources.txt"
              echo "LEGACY_CONTROL_CANDIDATE_REJECTED=$role"
            fi
          done
      - name: Produce 4x4 runtime-size comparison panels without promoting
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('build/identity-locked-walk-review')
          comparison=root/'runtime-size-review-only'
          comparison.mkdir(exist_ok=True)
          for role in ('OP','LOG','ENG','TECH'):
              src=root/f'CHR-{role}-WALK-identity-locked-REVIEW.png'
              if not src.is_file():continue
              with Image.open(src) as old:
                  if old.size!=(1024,1024):raise SystemExit('unexpected review source size')
                  if old.getchannel('A').crop((0,512,1024,1024)).getbbox():
                      raise SystemExit('unexpected pixels in unused atlas rows')
                  old.save(comparison/f'zte_chr_{role.lower()}_walk_final.png',optimize=True)
          if not list(comparison.glob('*.png')):
              raise SystemExit('No independent WALK review candidates survived')
          PY
          python tools/sprites/build_character_review_panels.py \
            --candidates build/identity-locked-walk-review/runtime-size-review-only \
            --output-dir build/identity-locked-walk-review/frame-panels
      - name: Enforce no visual approval and no canonical mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/identity-locked-walk-review')
          results=[json.loads(p.read_text()) for p in root.glob('*-review.json')]
          assert results
          assert len({x['asset_id'] for x in results})==len(results)
          assert all(x['asset_id'] in {
              'CHR-OP-WALK','CHR-LOG-WALK','CHR-ENG-WALK','CHR-TECH-WALK'}
              for x in results)
          for x in results:
              assert x['strict_status']=='NEEDS_REVIEW'
              assert x['semantic_review_pass'] is False
              assert x['visual_review_pass'] is False
              assert x['integrated_into_game'] is False
              assert x['canonical_source_overwritten'] is False
              assert x['visual_risk_screen']['risk_level']!='BLOCKING'
          print('IDENTITY_LOCKED_REVIEW_CANDIDATES='+str(len(results))+'; NO_CANONICAL_PROMOTION')
          PY
          git diff --exit-code -- art/incoming/final-sprites/ app/src/main/res/
      - name: Upload identity-locked alternatives for honest visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: identity-locked-walk-${{ github.run_id }}-NEEDS_REVIEW
          path: build/identity-locked-walk-review/
          retention-days: 30
