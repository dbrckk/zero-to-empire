name: Pollinations Character Atlas

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      batch_count:
        description: Character atlas candidates to attempt
        required: false
        default: '2'
      chain_depth:
        description: Internal auto-chain depth
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - 'tools/sprites/pollinations_character_sheet_factory.py'
      - 'art/production/controlled-character-regen-queue.json'
      - '.github/workflows/pollinations-character-atlas.yml'
      - 'ops/pollinations-character-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: pollinations-character-atlas
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLLINATIONS_CHR_BATCH: ${{ inputs.batch_count || '2' }}
      POLLINATIONS_CHR_ATTEMPTS: '2'
      POLLINATIONS_CHR_SEED: ${{ github.run_id }}
      POLLINATIONS_CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync canonical main
        run: git pull --ff-only origin main
      - name: Check controlled character queue
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('art/production/controlled-character-regen-queue.json')
          pending=0
          if p.exists():
              q=json.loads(p.read_text(encoding='utf-8'))
              pending=sum(1 for x in q.get('targets',[]) if str(x.get('status','')).upper()=='PENDING')
          print(f'pending={pending}')
          print(f'should_generate={str(pending > 0).lower()}')
          PY
      - name: Cache rembg U2Net model
        if: steps.gate.outputs.should_generate == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v0.0.0
      - name: Install strict image tooling
        if: steps.gate.outputs.should_generate == 'true'
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'rembg[cpu]>=2.0.68,<3'
      - name: Generate character atlas candidates
        if: steps.gate.outputs.should_generate == 'true'
        run: python -u tools/sprites/pollinations_character_sheet_factory.py
      - name: Require at least one candidate
        if: steps.gate.outputs.should_generate == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('art/production/pollinations-character-summary.json').read_text())
          good=[x for x in d if x.get('status')=='CANDIDATE']
          if not good:
              raise SystemExit('No character atlas candidate passed generation QA')
          print('CHARACTER_CANDIDATES=' + ','.join(x['id'] for x in good))
          PY
      - name: Commit candidates and QA evidence only
        if: steps.gate.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/production/controlled-character-regen-queue.json
          git add art/incoming/final-sprites/
          git add art/production/pollinations-character-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'art: persist controlled character atlas candidates'
          git pull --rebase origin main
          git push
      - name: Upload character QA evidence
        if: steps.gate.outputs.should_generate == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pollinations-character-atlas-evidence
          path: |
            art/production/pollinations-character-summary.json
            art/production/controlled-character-regen-queue.json
            art/incoming/final-sprites/zte_chr_*_final.png
          if-no-files-found: warn
          retention-days: 14
      - name: Auto-chain controlled queue
        if: steps.gate.outputs.should_generate == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/production/controlled-character-regen-queue.json')
          q=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(sum(1 for x in q.get('targets',[]) if str(x.get('status','')).upper()=='PENDING'))
          PY
          )
          depth="${POLLINATIONS_CHAIN_DEPTH:-0}"
          echo "CHARACTER_QUEUE_REMAINING=$remaining"
          if [ "$remaining" -eq 0 ]; then exit 0; fi
          if [ "$depth" -ge 8 ]; then
            echo "::error::Controlled character chain safety limit reached."
            exit 1
          fi
          next=$((depth+1))
          sleep 20
          gh workflow run "Pollinations Character Atlas" --ref main -f batch_count=2 -f chain_depth="$next"
