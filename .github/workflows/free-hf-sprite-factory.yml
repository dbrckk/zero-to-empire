name: Free HF Sprite Factory

on:
  workflow_dispatch:
    inputs:
      target:
        description: Manifest asset ID to generate
        required: true
        default: FX-06
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [ main ]
    paths:
      - 'tools/sprites/hf_sprite_factory.py'
      - 'tools/sprites/process_final_sprites.py'
      - 'tools/sprites/integrate_fx06_runtime.py'
      - '.github/workflows/free-hf-sprite-factory.yml'

permissions:
  contents: write

concurrency:
  group: free-hf-sprite-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: mcp-tools/Z-Image-Turbo
      SPRITE_TARGET: ${{ inputs.target || 'FX-06' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Detect existing target candidate
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SPRITE_TARGET}" = 'FX-06' ] && [ -s art/incoming/final-sprites/zte_fx_06_final.png ]; then
            echo 'candidate_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'candidate_exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require authenticated Hugging Face access
        if: steps.existing.outputs.candidate_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo 'Missing Actions secret HF_TOKEN.' >&2
            exit 2
          fi

      - name: Generate and validate one candidate
        if: steps.existing.outputs.candidate_exists != 'true'
        run: python tools/sprites/hf_sprite_factory.py

      - name: Finalize candidate into runtime WebP
        run: python tools/sprites/process_final_sprites.py

      - name: Integrate FX-06 into the power-core tap runtime
        if: env.SPRITE_TARGET == 'FX-06'
        run: python tools/sprites/integrate_fx06_runtime.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      - name: Verify Android runtime integration
        run: gradle --no-daemon testDebugUnitTest testReleaseUnitTest lintRelease assembleDebug assembleRelease bundleRelease

      - name: Commit only after generation, finalization and Android verification succeed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/incoming/final-sprites/ app/src/main/res/drawable-nodpi/ app/src/main/java/com/zerotoempire/game/AscendantCityWorld.kt
          if git diff --cached --quiet; then
            echo 'No validated runtime changes to commit.'
            exit 0
          fi
          git commit -m "art: integrate ${SPRITE_TARGET} validated runtime asset"
          git push

      - name: Upload candidate for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-${{ env.SPRITE_TARGET }}
          path: art/incoming/final-sprites/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload finalized runtime sprite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ env.SPRITE_TARGET }}
          path: app/src/main/res/drawable-nodpi/zte_fx_06_final.webp
          if-no-files-found: error
          retention-days: 30
