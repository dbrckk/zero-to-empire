name: Engineer Motion Candidate Visual Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/test_local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_action_fx.py'
      - '.github/workflows/engineer-motion-candidate-review.yml'

permissions:
  contents: read

jobs:
  render-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free local vector tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - name: Exercise actual gait, ratchet and fixed-socket tests
        run: |
          python -m unittest discover -s tools/sprites -p 'test_local_character_contact_gait.py' -v
          python -m unittest discover -s tools/sprites -p 'test_local_character_action_fx.py' -v
      - name: Render ENGINEER WALK and REPAIR from changed editable vector rig
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/sprites')
          from render_chatgpt_originals import render_atlas
          out=Path('build/engineer-motion-review')
          for action in ('WALK','REPAIR'):
              item=render_atlas('ENG',action,out,save_svgs=True)
              assert item['strict_approved'] is False
              print('RENDERED_ENGINEER_'+action+'='+str(item['frames']))
          PY
      - name: Compare original/current 42px action on night and daylight stages
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          sys.path.insert(0,'tools/sprites')
          from audit_character_bank_motion import motion_stats,composite,DAY,NIGHT
          out=Path('build/engineer-motion-review')
          original=Path('art/incoming/chatgpt-original/candidates')
          w=1000
          board=Image.new('RGB',(w,16*69+64),(19,30,44))
          pen=ImageDraw.Draw(board)
          pen.text((15,12),'ZERO TO EMPIRE — engineer motion at real 42px',fill=(241,248,255))
          pen.text((15,32),'REVIEW ONLY. No automatic approval or Android promotion.',fill=(174,197,216))
          metrics={'review_only':True,'semantic_approved':False,
                   'runtime_promoted':False,'strict_done_added':0,
                   'mobile_render_px':42,'actions':{}}
          for action_index,(action,count) in enumerate((('WALK',8),('REPAIR',10))):
              filename='zte_chr_eng_'+action.lower()+'_final.png'
              old=original/filename
              new=out/'candidates'/filename
              before=old.read_bytes()
              after=new.read_bytes()
              # This workflow also runs for REPAIR-only changes. The untouched
              # WALK is an identity/control baseline, not a test failure.
              changed=before!=after
              print('ENGINEER_'+action+'_CHANGED='+str(changed))
              before_m=motion_stats(before,count)
              after_m=motion_stats(after,count)
              metrics['actions'][action]={
                  'old':before_m,'candidate':after_m,
                  'motion_change_delta':round(after_m['mean_frame_change']-before_m['mean_frame_change'],5),
                  'lower_body_change_delta':round(after_m['mean_lower_body_change']-before_m['mean_lower_body_change'],5),
                  'changed_from_committed':changed,
                  'requires_visual_review':True,
              }
              with Image.open(old) as a,Image.open(new) as b:
                  for candidate_index,atlas in enumerate((a,b)):
                      frames=[atlas.crop(((i%4)*256,(i//4)*256,(i%4+1)*256,(i//4+1)*256)) for i in range(count)]
                      assert all(fr.getchannel('A').getbbox() is not None for fr in frames)
                      for lighting_index,(bg,caption) in enumerate(((NIGHT,'night'),(DAY,'day'))):
                          row=action_index*8+candidate_index*4+lighting_index*2
                          yy=row*69+70
                          pen.text((15,yy+8),action+' / '+('CURRENT' if candidate_index==0 else 'NEW')+' / '+caption,fill=(216,234,248))
                          for i,fr in enumerate(frames):
                              tiny=composite(fr,bg)
                              xx=250+i*70
                              board.paste(tiny,(xx,yy))
                              pen.text((xx+14,yy+43),str(i+1),fill=(166,187,208))
                          # Two duplicate rows intentionally show stage size and a
                          # transparent-cell alignment baseline without resampling.
                          if row%2==0:
                              pen.text((15,yy+27),'exact 42 px',fill=(157,180,202))
              print(action,'42px baseline',before_m,'42px candidate',after_m)
          (out/'review-metrics.json').write_text(json.dumps(metrics,indent=2)+'\n')
          board.save(out/'engineer-walk-repair-real-42px.png',optimize=True)
          print('ENGINEER_COMPARISON_REVIEW_ONLY=1')
          PY
      - name: Publish original and proposed sprite sheets for inspection
        uses: actions/upload-artifact@v4
        with:
          name: engineer-walk-repair-review-only
          path: |
            build/engineer-motion-review/candidates/*.png
            build/engineer-motion-review/src_svg/ENG/**/*.svg
            build/engineer-motion-review/review-metrics.json
            build/engineer-motion-review/engineer-walk-repair-real-42px.png
          if-no-files-found: error
          retention-days: 30
