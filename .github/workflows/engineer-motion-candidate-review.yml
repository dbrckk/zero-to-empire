name: Engineer Motion Candidate Visual Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/test_local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_action_fx.py'
      - '.github/workflows/engineer-motion-candidate-review.yml'

  push:
    branches: [main]
    paths:
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/test_local_character_contact_gait.py'
      - 'tools/sprites/test_local_character_action_fx.py'
      - '.github/workflows/engineer-motion-candidate-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free local vector tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - name: Exercise actual gait, ratchet and fixed-socket tests
        run: |
          python -m unittest discover -s tools/sprites -p 'test_local_character_contact_gait.py' -v
          python -m unittest discover -s tools/sprites -p 'test_local_character_action_fx.py' -v
      - name: Render ENGINEER WALK, WORK and REPAIR from editable vector rig
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/sprites')
          from render_chatgpt_originals import render_atlas
          out=Path('build/engineer-motion-review')
          for action in ('WALK','WORK','REPAIR'):
              item=render_atlas('ENG',action,out,save_svgs=True)
              assert item['strict_approved'] is False
              print('RENDERED_ENGINEER_'+action+'='+str(item['frames']))
          PY
      - name: Download canonical collector-first character bank
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/engineer-motion-review
          gh release download zte-character-candidates --repo "$GITHUB_REPOSITORY" \
            --pattern 'zte-character-bank-current.zip' \
            --dir build/engineer-motion-review
      - name: Compare independent Kaggle collector and local vector rig at 42px
        run: |
          python - <<'PY'
          import hashlib,io,json,zipfile,sys
          from pathlib import Path
          from PIL import Image,ImageDraw
          sys.path.insert(0,'tools/sprites')
          from audit_character_bank_motion import motion_stats,composite,DAY,NIGHT
          out=Path('build/engineer-motion-review')
          board=Image.new('RGB',(1000,12*69+64),(19,30,44))
          pen=ImageDraw.Draw(board)
          pen.text((15,12),'ZERO TO EMPIRE / ENGINEER / real independent 42px comparison',fill=(241,248,255))
          pen.text((15,32),'Kaggle collector bank vs local vector alternative. REVIEW ONLY; no automatic approval.',fill=(174,197,216))
          metrics={'review_only':True,'semantic_approved':False,
                   'runtime_promoted':False,'strict_done_added':0,
                   'mobile_render_px':42,'comparison_independent':True,
                   'canonical_bank_profile':'collector-first','actions':{}}
          with zipfile.ZipFile(out/'zte-character-bank-current.zip') as bank:
              assert bank.namelist().count('candidate-bank-index.json') == 1
              bank_index=json.loads(bank.read('candidate-bank-index.json'))
              assert bank_index['source_selection_profile']=='collector-first'
              assert bank_index['automatic_semantic_approval'] is False
              assert bank_index['automatic_runtime_promotion'] is False
              entries=bank_index['bank_entries']
              assert len(entries)==bank_index['candidate_count']
              assert len({row['id'] for row in entries})==len(entries)
              by_id={row['id']:row for row in entries}
              for action_index,(action,count) in enumerate((('WALK',8),('WORK',10),('REPAIR',10))):
                  asset_id='CHR-ENG-'+action
                  name='zte_chr_eng_'+action.lower()+'_final.png'
                  entry=by_id[asset_id]
                  assert entry['filename']==name and entry['source_type']=='collected-kaggle', asset_id
                  assert entry['strict_approved'] is False and entry['runtime_promoted'] is False
                  member='candidates/'+name
                  assert bank.namelist().count(member)==1
                  before=bank.read(member)
                  assert len(before)==entry['bytes']
                  before_sha=hashlib.sha256(before).hexdigest()
                  assert before_sha==entry['sha256'], 'Untrusted Kaggle source: '+asset_id
                  after=(out/'candidates'/name).read_bytes()
                  after_sha=hashlib.sha256(after).hexdigest()
                  assert after_sha!=before_sha, 'False comparison: identical input sprites '+asset_id
                  for blob in (before,after):
                      with Image.open(io.BytesIO(blob)) as check:
                          check.load()
                          assert check.size==(1024,1024) and check.mode=='RGBA'
                          assert all(check.crop(((i%4)*256,(i//4)*256,(i%4+1)*256,(i//4+1)*256)).getchannel('A').getbbox() is not None for i in range(count))
                  bm=motion_stats(before,count)
                  am=motion_stats(after,count)
                  metrics['actions'][action]={
                      'collector':bm,'vector':am,
                      'collector_source_type':'collected-kaggle',
                      'collector_run_id':entry['source_collector_run_id'],
                      'collector_sha256':before_sha,'vector_sha256':after_sha,
                      'mean_frame_change_delta':round(am['mean_frame_change']-bm['mean_frame_change'],5),
                      'lower_body_change_delta':round(am['mean_lower_body_change']-bm['mean_lower_body_change'],5),
                      'requires_visual_review':True,'runtime_promoted':False}
                  for candidate_index,blob in enumerate((before,after)):
                      with Image.open(io.BytesIO(blob)) as atlas:
                          frames=[atlas.crop(((i%4)*256,(i//4)*256,(i%4+1)*256,(i//4+1)*256)) for i in range(count)]
                          for lighting_index,(bg,caption) in enumerate(((NIGHT,'night'),(DAY,'day'))):
                              row=action_index*4+candidate_index*2+lighting_index
                              yy=row*69+70
                              kind='COLLECTOR' if candidate_index==0 else 'VECTOR'
                              pen.text((15,yy+8),action+' / '+kind+' / '+caption,fill=(216,234,248))
                              pen.text((15,yy+27),'exact 42 px',fill=(157,180,202))
                              for i,fr in enumerate(frames):
                                  tiny=composite(fr,bg)
                                  xx=250+i*70
                                  board.paste(tiny,(xx,yy))
                                  pen.text((xx+14,yy+43),str(i+1),fill=(166,187,208))
                  print('ENGINEER_'+action+'_COLLECTOR_SHA256='+before_sha)
                  print('ENGINEER_'+action+'_VECTOR_SHA256='+after_sha)
                  print('ENGINEER_'+action+'_MOTION_DELTA='+str(metrics['actions'][action]['mean_frame_change_delta']))
          (out/'review-metrics.json').write_text(json.dumps(metrics,indent=2)+'\n')
          board.save(out/'engineer-walk-repair-real-42px.png',optimize=True)
          print('ENGINEER_COMPARISON_INDEPENDENT=1')
          print('ENGINEER_COMPARISON_REVIEW_ONLY=1')
          PY
      - name: Publish original and proposed sprite sheets for inspection
        uses: actions/upload-artifact@v4
        with:
          name: engineer-walk-repair-review-only
          path: |
            build/engineer-motion-review/candidates/*.png
            build/engineer-motion-review/src_svg/ENG/**/*.svg
            build/engineer-motion-review/review-metrics.json
            build/engineer-motion-review/engineer-walk-repair-real-42px.png
          if-no-files-found: error
          retention-days: 30
