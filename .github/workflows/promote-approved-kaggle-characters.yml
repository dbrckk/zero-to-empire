name: Promote Approved Kaggle Characters

on:
  push:
    branches: [main]
    paths:
      - 'ops/promote-kaggle-trigger.txt'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Collector/source run containing the approved artifact, or auto
        required: false
        default: 'auto'
      approved_ids:
        description: Comma-separated visually approved CHR IDs; include the same-run IDLE anchor when replacing a legacy role family
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  # Serialise every canonical strict-ledger writer with Asset Autofactory.
  group: asset-autofactory-235
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Sync canonical main
        run: git pull --ff-only origin main
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Resolve promotion request
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_APPROVED_IDS: ${{ inputs.approved_ids || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_run="$INPUT_SOURCE_RUN_ID"
          approved="$INPUT_APPROVED_IDS"
          if [ -z "$approved" ]; then
            IFS='|' read -r source_run approved < ops/promote-kaggle-trigger.txt
          fi
          test -n "$approved"
          if [ -z "$source_run" ] || [ "$source_run" = auto ]; then
            source_run="$(APPROVED_IDS="$approved" python - <<'PY'
          import json, os
          from pathlib import Path
          ids={x.strip().upper() for x in os.environ['APPROVED_IDS'].split(',') if x.strip()}
          q=json.loads(Path('art/production/master-asset-queue.json').read_text())
          runs={
              str(a.get('review_artifact_run_id'))
              for a in q.get('assets',[])
              if a.get('id') in ids and a.get('strict_status')!='DONE'
              and a.get('review_artifact_run_id')
          }
          # Context-only IDLE anchors are already strict DONE in the master,
          # so their new artifact provenance lives in the controlled queue.
          controlled=json.loads(Path('art/production/controlled-character-regen-queue.json').read_text())
          runs.update(
              str(item['review_artifact_run_id'])
              for item in controlled.get('targets',[])
              if item.get('id') in ids and item.get('autofactory_context_only')
              and item.get('review_artifact_run_id')
          )
          if len(runs)!=1:
              raise SystemExit(
                  'Automatic source run resolution requires one shared review_artifact_run_id; '
                  f'approved={sorted(ids)} runs={sorted(runs)}'
              )
          print(next(iter(runs)))
          PY
            )"
          fi
          test -n "$source_run"
          SOURCE_RUN_ID="$source_run" APPROVED_IDS="$approved" python - <<'PY'
          import json, os
          from pathlib import Path
          source=str(os.environ['SOURCE_RUN_ID'])
          ids={x.strip().upper() for x in os.environ['APPROVED_IDS'].split(',') if x.strip()}
          q=json.loads(Path('art/production/master-asset-queue.json').read_text())
          controlled=json.loads(Path('art/production/controlled-character-regen-queue.json').read_text())
          contexts={str(item.get('id','')).upper():item for item in controlled.get('targets',[])}
          known={str(a.get('id','')).upper():a for a in q.get('assets',[])}
          mismatched=[f"{aid}:unknown-asset" for aid in ids-known.keys()]
          for aid in ids & known.keys():
              asset=known[aid]
              if asset.get('strict_status')=='DONE':
                  # Replacing a legacy strict-DONE IDLE sheet does not raise
                  # strict progress, but is necessary for full-role identity.
                  if not str(aid).endswith('-IDLE'):
                      mismatched.append(f"{aid}:already-DONE-non-IDLE")
                      continue
                  context=contexts.get(aid,{})
                  if (not context.get('autofactory_context_only')
                      or context.get('status')!='AWAITING_REVIEW'
                      or str(context.get('review_artifact_run_id') or '')!=source):
                      mismatched.append(f"{aid}:unreviewed-context-anchor")
                  continue
              recorded=asset.get('review_artifact_run_id')
              if (str(asset.get('pipeline_status','')).upper()!='AWAITING_REVIEW'
                  or str(recorded or '')!=source):
                  mismatched.append(f"{aid}:not-current-reviewed-candidate:{recorded}")
          # Every newly promoted action must share the reference IDLE identity
          # in the same verified artifact. A previously replaced IDLE is valid
          # only when its strict promotion retains provenance from this run.
          for aid in ids:
              parts=aid.split('-')
              if len(parts)!=3 or parts[0]!='CHR' or parts[2]=='IDLE':
                  continue
              idle=f"CHR-{parts[1]}-IDLE"
              if idle in ids:
                  continue
              anchor=known.get(idle,{})
              approved_anchor=(
                  anchor.get('strict_status')=='DONE'
                  and str(anchor.get('review_artifact_run_id') or '')==source
                  and 'Explicit semantic review approved' in str(anchor.get('review_reason') or '')
              )
              if not approved_anchor:
                  mismatched.append(f"{aid}:missing-coherent-{idle}-anchor")
          if mismatched:
              raise SystemExit(
                  'Promotion source run does not match canonical review provenance: '
                  + ','.join(sorted(mismatched))
              )
          print('PROMOTION_SOURCE_PROVENANCE_PASS='+source)
          PY
          echo "SOURCE_RUN_ID=$source_run" >> "$GITHUB_ENV"
          echo "APPROVED_IDS=$approved" >> "$GITHUB_ENV"
      - name: Download source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/kaggle-approved
          mkdir -p /tmp/kaggle-approved
          if ! gh run download "$SOURCE_RUN_ID" -n kaggle-sprite-batch -D /tmp/kaggle-approved; then
            gh run download "$SOURCE_RUN_ID" -n kaggle-async-character-batch -D /tmp/kaggle-approved
          fi
          find /tmp/kaggle-approved -type f -print
      - name: Import only explicitly approved candidates
        env:
          APPROVED_IDS: ${{ env.APPROVED_IDS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          ids=[x.strip().upper() for x in os.environ['APPROVED_IDS'].split(',') if x.strip()]
          if not ids: raise SystemExit('No approved IDs')
          out=Path('art/incoming/final-sprites'); out.mkdir(parents=True,exist_ok=True)
          stems=[]
          for aid in ids:
              parts=aid.lower().split('-')
              if len(parts)!=3 or parts[0]!='chr': raise SystemExit('Only CHR IDs are supported: '+aid)
              stem=f'zte_chr_{parts[1]}_{parts[2]}_final'
              matches=list(Path('/tmp/kaggle-approved').rglob(stem+'.png'))
              if len(matches)!=1: raise SystemExit(f'{aid}: expected one candidate, found {len(matches)}')
              shutil.copy2(matches[0],out/(stem+'.png'))
              stems.append(stem)
          Path('/tmp/approved-stems.txt').write_text(','.join(stems))
          print('APPROVED_STEMS='+','.join(stems))
          PY
          echo "SPRITE_TARGETS=$(cat /tmp/approved-stems.txt)" >> "$GITHUB_ENV"
      - name: Run canonical runtime conversion and QA
        run: python tools/sprites/process_final_sprites.py
      - name: Validate approved runtimes and write QA evidence
        env:
          APPROVED_IDS: ${{ env.APPROVED_IDS }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "$APPROVED_IDS"
          for raw in "${ids[@]}"; do
            aid="$(echo "$raw" | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
            IFS='-' read -r prefix role action <<< "$aid"
            test "$prefix" = "CHR"
            stem="zte_chr_$(echo "$role" | tr '[:upper:]' '[:lower:]')_$(echo "$action" | tr '[:upper:]' '[:lower:]')_final"
            python tools/sprites/validate_runtime_asset.py \
              --asset-id "$aid" \
              --path "app/src/main/res/drawable-nodpi/${stem}.webp" \
              --report "art/production/${stem}-runtime-qa.json"
          done
          python3 tools/android/audit_character_runtime.py
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
      - name: Validate promoted Android runtime at release grade
        run: |
          set -euo pipefail
          python3 tools/android/validate_manifest_policy.py
          python3 tools/android/validate_release_privacy.py
          python3 tools/android/audit_character_runtime.py
          gradle assembleDebug --stacktrace
          gradle testDebugUnitTest --stacktrace
          gradle lintDebug --stacktrace
          gradle bundleRelease --stacktrace
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          test "$(wc -c < "$AAB")" -gt 100000
          echo "KAGGLE_CHARACTER_RELEASE_VALIDATION_PASS=1"
      - name: Mark approved characters strict DONE
        env:
          APPROVED_IDS: ${{ env.APPROVED_IDS }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ids={x.strip().upper() for x in os.environ['APPROVED_IDS'].split(',') if x.strip()}
          p=Path('art/production/master-asset-queue.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          found=set()
          for a in q.get('assets',[]):
              if a.get('id') in ids:
                  a['strict_status']='DONE'
                  a['pipeline_status']='DONE'
                  a['generation_required']=False
                  a['last_error']=None
                  a['review_artifact_run_id']=int(os.environ['SOURCE_RUN_ID'])
                  a['review_reason']=(
                      'Explicit semantic review approved Kaggle source run '
                      + os.environ.get('SOURCE_RUN_ID','unknown')
                      + '; deterministic runtime QA, canonical Android audit, '
                        'debug build, existing tests, lint and release bundle all passed.'
                  )
                  found.add(a['id'])
          missing=ids-found
          if missing: raise SystemExit('Approved IDs missing from master queue: '+','.join(sorted(missing)))
          p.write_text(json.dumps(q,indent=2)+'\n',encoding='utf-8')

          # Canonical strict promotions must update the 236-row Android
          # manifest in the SAME commit. ONB-00 is never promoted by this path.
          manifest=Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          rows=manifest.read_text(encoding='utf-8').splitlines(keepends=True)
          changed=set()
          for i,row in enumerate(rows):
              if not row.startswith('|') or 'app/src/main/res/' not in row:
                  continue
              parts=row.rstrip('\n').split('|')
              if len(parts)!=7:
                  continue
              aid=parts[1].strip()
              if aid not in ids:
                  continue
              if aid in changed:
                  raise SystemExit('Duplicate approved manifest ID: '+aid)
              status=parts[5].strip()
              if status not in {'RUNTIME','BLOCKED','DONE'}:
                  raise SystemExit(f'Unexpected promotion status for {aid}: {status}')
              parts[5]=' DONE '
              rows[i]='|'.join(parts)+'\n'
              changed.add(aid)
          if changed!=ids:
              raise SystemExit('Approved manifest IDs not found: '+','.join(sorted(ids-changed)))
          manifest.write_text(''.join(rows),encoding='utf-8')

          strict=sum(1 for a in q['assets'] if a.get('strict_status')=='DONE')
          processed=sum(1 for a in q['assets'] if a.get('strict_status')=='DONE' or str(a.get('pipeline_status','')).upper() in {'AWAITING_REVIEW','CANDIDATE','TECHNICAL_PASS','VALIDATED','APPROVED','RUNTIME_READY','DONE'})
          remain=[a for a in q['assets'] if str(a.get('id','')).startswith('CHR-') and a.get('strict_status')!='DONE']
          lines=[
              '# Character strict-review backlog','',
              'Generated from `art/production/master-asset-queue.json` after production completion.','',
              f'- Production processed: **{processed}/{q["target_total"]}**',
              f'- Strict DONE: **{strict}/{q["target_total"]}**',
              f'- Semantic review remaining: **{len(remain)}**',
              '- This report does **not** grant strict approval or runtime promotion.','',
              '| Asset | Role | Action | Technical status | Review artifact run | Review note |',
              '|---|---|---|---|---:|---|',
          ]
          for a in remain:
              parts=a['id'].split('-')
              note=str(a.get('review_reason') or 'Semantic review required.').replace('|','/')
              artifact_run=a.get('review_artifact_run_id') or '—'
              lines.append(f'| {a["id"]} | {parts[1]} | {"-".join(parts[2:])} | {a.get("pipeline_status","")} | {artifact_run} | {note} |')
          lines += ['', '## Review rule', '', 'A reviewer must inspect identity continuity, full-body framing, role/clothing consistency, action readability, animation motion, and runtime suitability. Only explicit reviewed approvals may change `strict_status` to `DONE`.']
          Path('art/production/character-strict-review-backlog.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(f'PROMOTION_STRICT_DONE={strict}/{q["target_total"]}')
          PY
      - name: Commit approved runtime assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/incoming/final-sprites app/src/main/res/drawable-nodpi art/production/*-runtime-qa.json art/production/master-asset-queue.json art/production/character-strict-review-backlog.md docs/art/FINAL_AAA_SPRITE_MANIFEST.md
          git diff --cached --quiet && exit 0
          git commit -m 'art: promote semantically approved Kaggle characters'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Continue autofactory after promotion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'Asset Autofactory 235' --ref main
