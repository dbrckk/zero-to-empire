name: Import BLD-09 ChatGPT Assets

on:
  push:
    branches:
      - art/import-bld09-chatgpt
    paths:
      - '.staging/BLD09_chatgpt_runtime_assets.zip'
      - '.github/workflows/import-bld09-chatgpt.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/import-bld09-chatgpt
          fetch-depth: 0

      - name: Import and validate BLD-09 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bld09
          mkdir -p /tmp/bld09
          unzip -q .staging/BLD09_chatgpt_runtime_assets.zip -d /tmp/bld09
          test "$(find /tmp/bld09 -maxdepth 1 -name 'zte_business_09_t*_final.webp' | wc -l)" -eq 7
          mkdir -p app/src/main/res/drawable-nodpi
          for i in 0 1 2 3 4 5 6; do
            f="/tmp/bld09/zte_business_09_t${i}_final.webp"
            test -s "$f"
            file "$f" | grep -qi 'Web/P image'
            cp "$f" app/src/main/res/drawable-nodpi/
          done

      - name: Replace staging payload with runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .staging/BLD09_chatgpt_runtime_assets.zip
          git rm .github/workflows/import-bld09-chatgpt.yml
          git add app/src/main/res/drawable-nodpi/zte_business_09_t*_final.webp
          git commit -m "art: import BLD-09 ChatGPT runtime family"
          git push origin HEAD:art/import-bld09-chatgpt
