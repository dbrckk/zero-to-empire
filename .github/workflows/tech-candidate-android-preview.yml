name: TECH candidate Android preview (no promotion)

on:
  push:
    branches: [main]
    paths:
      - 'art/production/character-rig-review-candidates/zte_chr_tech_*_final.png'
      - 'art/production/character-rig-review-candidates/review-report.json'
      - '.github/workflows/tech-candidate-android-preview.yml'
      - 'app/src/main/java/com/zerotoempire/game/ReviewedCharacterLayer.kt'
      - 'app/src/debug/java/com/zerotoempire/game/CharacterReviewActivity.kt'
      - 'app/src/debug/AndroidManifest.xml'
      - 'tools/android/character_preview_emulator_smoke.sh'
      - 'tools/android/ui_dump_retry.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tech-candidate-android-preview
  cancel-in-progress: true

jobs:
  debug-candidate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Static-validate Android QA shell and click helpers
        run: |
          bash -n tools/android/character_preview_emulator_smoke.sh
          bash -n tools/android/ui_dump_retry.sh
          python3 -m py_compile tools/android/ui_click_target.py
      - name: Verify six review candidates against source evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path('art/production/character-rig-review-candidates')
          r=json.loads((folder/'review-report.json').read_text())
          assert r['format']=='zte-canonical-tech-review-v1'
          assert r['target_ids']==['CHR-TECH-IDLE','CHR-TECH-WALK','CHR-TECH-WORK','CHR-TECH-CARRY','CHR-TECH-REPAIR','CHR-TECH-CELEB']
          assert r['automatic_promotion_permitted'] is False
          assert r['candidate_count']==6
          assert len(r['items'])==6
          assert all(i['source_skin_sha256']==r['source_skin_sha256'] for i in r['items'])
          assert len({i['staged_png'] for i in r['items']})==6
          assert r['semantic_approved_count']==0
          assert all(i['strict_status']=='NEEDS_REVIEW'
                     and i['canonical_geometry_pass']
                     and i['runtime_integrated'] is False
                     and i['release_eligible'] is False for i in r['items'])
          for i in r['items']:
              p=folder/i['staged_png']
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==i['staged_sha256']
          q=json.loads(Path('art/production/master-asset-queue.json').read_text())
          for a in q['assets']:
              if a['id'] in ('CHR-TECH-WALK', 'CHR-TECH-WORK', 'CHR-TECH-CARRY'):
                  assert a['strict_status']!='DONE'
              if a['id'] in ('CHR-TECH-IDLE', 'CHR-TECH-REPAIR', 'CHR-TECH-CELEB'):
                  assert a['strict_status']=='DONE'
          print('REVIEW_ONLY_VERIFIED=6 NO_STRICT_PROMOTION=1')
          PY
      - name: Convert staged candidates into temporary Android preview resources
        env:
          SPRITE_TARGETS: zte_chr_tech_idle_final,zte_chr_tech_walk_final,zte_chr_tech_work_final,zte_chr_tech_carry_final,zte_chr_tech_repair_final,zte_chr_tech_celeb_final
        run: |
          set -euo pipefail
          for action in idle walk work carry repair celeb; do
            cp "art/production/character-rig-review-candidates/zte_chr_tech_$action"_"final.png" \
               "art/incoming/final-sprites/zte_chr_tech_$action"_"final.png"
          done
          python tools/sprites/process_final_sprites.py
          for action in IDLE WALK WORK CARRY REPAIR CELEB; do
            lc="$(echo "$action" | tr '[:upper:]' '[:lower:]')"
            python tools/sprites/validate_runtime_asset.py \
              --asset-id "CHR-TECH-$action" \
              --path "app/src/main/res/drawable-nodpi/zte_chr_tech_$lc"_"final.webp"
          done
          python tools/android/audit_character_runtime.py
          git diff --exit-code -- art/production/master-asset-queue.json docs/art/FINAL_AAA_SPRITE_MANIFEST.md
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug preview and verify tests/lint
        run: |
          gradle assembleDebug --stacktrace
          gradle testDebugUnitTest --stacktrace
          gradle lintDebug --stacktrace
      - name: Persist temporary APK provenance, not a release claim
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('art/production/character-rig-review-candidates/review-report.json').read_text())
          assets=[]
          for x in r['items']:
              stem=x['staged_png'].removesuffix('.png')
              webp=Path('app/src/main/res/drawable-nodpi')/(stem+'.webp')
              assets.append({
                  'id':x['asset_id'],
                  'candidate_sha256':x['staged_sha256'],
                  'temporary_runtime_sha256':hashlib.sha256(webp.read_bytes()).hexdigest(),
                  'semantic_approved':False,'release_eligible':False,
              })
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>100000
          result={'format':'zte-tech-debug-preview-v1',
                  'debug_apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
                  'candidate_count':6,'strict_status':'NEEDS_REVIEW',
                  'production_files_committed':False,
                  'source_and_runtime_staged_only_in_ci':True,
                  'actual_playability_on_device':'NOT_YET_TESTED',
                  'assets':assets}
          Path('tech-candidate-debug-evidence.json').write_text(json.dumps(result,indent=2)+'\n')
          print('DEBUG_TECH_CANDIDATE_PREVIEW_BUILT_NO_STRICT_DONE=1')
          PY
      - name: Enable KVM acceleration on the ephemeral GitHub runner
        run: |
          set -euo pipefail
          # Previously /dev/kvm existed but the runner lacked permission.
          # Without KVM, Android's QEMU guest booted in >5 minutes and
          # repeatedly blocked on "System UI isn't responding".
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          # android-emulator-runner installs the emulator binary later.
          # Its explicit disable-linux-hw-accel: false prevents fallback.
          echo "KVM_NODE_ACCESS_VERIFIED=1"
      - name: Validate actual review APK on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 35 cold boot was unreliable without KVM.
          # Keep the lighter API 33 image and smaller profile with KVM enabled.
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          # Fail closed if acceleration cannot be enabled on the runner.
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: bash tools/android/character_preview_emulator_smoke.sh
      - name: Upload isolated Android APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-six-art-review-debug-apk-not-approved
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            tech-candidate-debug-evidence.json
            art/production/character-rig-review-candidates/review-report.json
            /tmp/zte-character-preview/**
          if-no-files-found: warn
          retention-days: 14
