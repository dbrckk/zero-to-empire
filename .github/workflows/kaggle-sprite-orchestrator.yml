name: Kaggle Sprite Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: kaggle-sprite-orchestrator
  cancel-in-progress: false

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KERNEL: dbrckk/zero-to-empire-sprite-factory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'Missing repository secret KAGGLE_API_TOKEN.' >&2
            exit 2
          fi

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Authenticate Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          if [ -n "${KAGGLE_USERNAME:-}" ]; then
            python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path.home()/'.kaggle'/'kaggle.json'
          p.write_text(json.dumps({'username': os.environ['KAGGLE_USERNAME'], 'key': os.environ['KAGGLE_API_TOKEN']}))
          p.chmod(0o600)
          PY
          else
            echo 'Using KAGGLE_API_TOKEN authentication.'
          fi
          kaggle --version

      - name: Push and start Kaggle GPU kernel
        working-directory: kaggle
        run: kaggle kernels push -p .

      - name: Wait for Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -Eqi 'complete|success'; then exit 0; fi
            if echo "$status" | grep -Eqi 'error|failed|cancel'; then exit 1; fi
            sleep 60
          done
          echo 'Timed out waiting for Kaggle kernel.' >&2
          exit 1

      - name: Download Kaggle outputs
        run: |
          rm -rf /tmp/kaggle-output
          mkdir -p /tmp/kaggle-output
          kaggle kernels output "$KERNEL" -p /tmp/kaggle-output --force
          find /tmp/kaggle-output -maxdepth 2 -type f -printf '%p\n'

      - name: Import generated candidates
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find /tmp/kaggle-output -type f -name 'zero-to-empire-kaggle-candidates.zip' | head -1)"
          if [ -z "$zip" ]; then
            echo 'No candidate ZIP produced; nothing to integrate.'
            exit 0
          fi
          rm -rf /tmp/kaggle-candidates
          mkdir -p /tmp/kaggle-candidates
          unzip -q "$zip" -d /tmp/kaggle-candidates
          mkdir -p art/incoming/final-sprites
          find /tmp/kaggle-candidates -type f -name '*_final.png' -exec cp {} art/incoming/final-sprites/ \;

      - name: QA and finalize exact Kaggle candidates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/kaggle-candidates -type f -name '*_final.png' 2>/dev/null | sort || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No generated candidates.'
            exit 0
          fi
          python tools/sprites/build_sprite_contact_sheet.py --files "${files[@]}" --output /tmp/kaggle-contact-sheet.png --report /tmp/kaggle-qa.json
          targets="$(printf '%s\n' "${files[@]}" | sed -E 's#.*/##; s/\.png$//' | paste -sd, -)"
          SPRITE_TARGETS="$targets" python tools/sprites/process_final_sprites.py

      - name: Commit finalized runtime sprites
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No sprite changes to commit.'
            exit 0
          fi
          git config user.name 'zero-empire-art-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add art/incoming/final-sprites app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'art: finalize Kaggle GPU sprite batch'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-sprite-qa
          path: |
            /tmp/kaggle-contact-sheet.png
            /tmp/kaggle-qa.json
          if-no-files-found: ignore
          retention-days: 30
