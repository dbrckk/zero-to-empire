name: Pollinations Building Candidate

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      batch_count:
        description: Building candidates to attempt in this run
        required: false
        default: '8'
  push:
    branches: [main]
    paths:
      - 'tools/sprites/pollinations_building_factory.py'
      - 'tools/sprites/pollinations_building_batch.py'
      - 'tools/sprites/validate_runtime_asset.py'
      - 'art/production/controlled-building-regen-queue.json'
      - '.github/workflows/pollinations-building-candidate.yml'
      - 'ops/pollinations-building-trigger.txt'

permissions:
  contents: write

concurrency:
  group: pollinations-building-candidate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLLINATIONS_BATCH_COUNT: ${{ inputs.batch_count || '8' }}
      POLLINATIONS_ATTEMPTS: '3'
      POLLINATIONS_BASE_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync canonical main
        run: git pull --ff-only origin main

      - name: Check production queue and semantic review lock
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          review=Path('docs/art/AAA_HISTORICAL_PROMOTION_REVIEW.md').read_text(encoding='utf-8')
          review_open='**Status: OPEN**' in review

          queue_path=Path('art/production/controlled-building-regen-queue.json')
          queue_pending=0
          if queue_path.exists():
              data=json.loads(queue_path.read_text(encoding='utf-8'))
              queue_pending=sum(1 for x in data.get('targets',[]) if str(x.get('status','')).upper()=='PENDING')

          todo_pending=0
          for line in Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md').read_text(encoding='utf-8').splitlines():
              if not line.startswith('|') or 'app/src/main/res/' not in line:
                  continue
              cols=[x.strip() for x in line.split('|')[1:-1]]
              if len(cols)==5 and cols[0].startswith('BLD-') and cols[4].upper()=='TODO':
                  todo_pending += 1

          candidate_only=queue_pending > 0
          should_generate=candidate_only or ((not review_open) and todo_pending > 0)

          print(f'review_open={str(review_open).lower()}')
          print(f'queue_pending={queue_pending}')
          print(f'todo_pending={todo_pending}')
          print(f'candidate_only={str(candidate_only).lower()}')
          print(f'should_generate={str(should_generate).lower()}')
          PY

      - name: Cache rembg U2Net model
        if: steps.gate.outputs.should_generate == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v0.0.0

      - name: Install strict image tooling
        if: steps.gate.outputs.should_generate == 'true'
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'rembg[cpu]>=2.0.68,<3'

      - name: Generate and technically validate building batch
        if: steps.gate.outputs.should_generate == 'true'
        env:
          POLLINATIONS_CANDIDATE_ONLY: ${{ steps.gate.outputs.candidate_only }}
        run: python -u tools/sprites/pollinations_building_batch.py

      - name: Require at least one technical success
        if: steps.gate.outputs.should_generate == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('art/production/pollinations-batch-summary.json').read_text())
          if not d.get('successes'):
              raise SystemExit('No Pollinations building candidate passed this run')
          label='STRICT_BATCH_CANDIDATE' if d.get('mode')=='candidate-only' else 'STRICT_BATCH_RUNTIME'
          print(label + '=' + ','.join(x['id'] for x in d['successes']))
          if d.get('failures'):
              print('STRICT_BATCH_BLOCKED=' + ','.join(x['id'] for x in d['failures']))
          PY

      - name: Commit validated candidates and evidence
        if: steps.gate.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/art/FINAL_AAA_SPRITE_MANIFEST.md
          git add art/production/controlled-building-regen-queue.json
          git add app/src/main/res/drawable-nodpi/
          git add art/incoming/final-sprites/
          git add art/production/pollinations-*.json art/production/pollinations-*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No validated changes to commit'
            exit 0
          fi
          if [ "${{ steps.gate.outputs.candidate_only }}" = "true" ]; then
            git commit -m 'art: persist controlled Pollinations candidates'
          else
            git commit -m 'art: persist double-validated Pollinations runtime batch'
          fi
          git pull --rebase origin main
          git push

      - name: Upload strict batch evidence
        if: steps.gate.outputs.should_generate == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pollinations-building-batch-evidence
          path: |
            art/production/pollinations-batch-summary.json
            art/production/pollinations-*-report.json
            art/production/pollinations-*-qa.json
            art/production/pollinations-*-contact.png
          if-no-files-found: warn
          retention-days: 14
