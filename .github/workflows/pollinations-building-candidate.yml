name: Pollinations Building Candidate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Optional TODO building ID
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'tools/sprites/pollinations_building_factory.py'
      - '.github/workflows/pollinations-building-candidate.yml'

permissions:
  contents: write

concurrency:
  group: pollinations-building-candidate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SPRITE_TARGET: ${{ inputs.target || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'rembg[cpu]>=2.0.68,<3'
      - name: Generate one anonymous free candidate
        run: python -u tools/sprites/pollinations_building_factory.py
      - name: Resolve generated target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          f=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('art/production/pollinations-report.json').read_text())
          print(d['candidate'])
          PY
          )
          test -s "$f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "stem=$(basename "$f" .png)" >> "$GITHUB_OUTPUT"
      - name: Strict technical QA
        shell: bash
        run: |
          f='${{ steps.target.outputs.file }}'
          python tools/sprites/build_sprite_contact_sheet.py --files "$f" --output art/production/pollinations-contact-sheet.png --report art/production/pollinations-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('art/production/pollinations-qa.json').read_text())
          rows=d.get('assets',[])
          if len(rows)!=1 or not rows[0].get('pass'):
              raise SystemExit('Strict QA rejected Pollinations candidate: '+json.dumps(rows))
          print('POLLINATIONS_STRICT_QA_PASS=1')
          PY
      - name: Verify runtime finalizer accepts candidate
        shell: bash
        run: |
          stem='${{ steps.target.outputs.stem }}'
          SPRITE_TARGETS="$stem" python tools/sprites/process_final_sprites.py
      - name: Persist strictly validated candidate as RUNTIME
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('art/production/pollinations-report.json').read_text())
          target=report['target']
          manifest=Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          lines=manifest.read_text(encoding='utf-8').splitlines()
          out=[]; changed=0
          for line in lines:
              if line.startswith('|'):
                  cols=[x.strip() for x in line.split('|')[1:-1]]
                  if len(cols)==5 and cols[0]==target and cols[4].upper()=='TODO':
                      cols[4]='RUNTIME'
                      line='| '+' | '.join(cols)+' |'
                      changed+=1
              out.append(line)
          if changed!=1:
              raise SystemExit(f'Expected exactly one TODO manifest row for {target}, changed={changed}')
          manifest.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'POLLINATIONS_MANIFEST_RUNTIME={target}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '${{ steps.target.outputs.file }}' \
                  'app/src/main/res/drawable-nodpi/${{ steps.target.outputs.stem }}.webp' \
                  art/production/pollinations-report.json \
                  art/production/pollinations-qa.json \
                  docs/art/FINAL_AAA_SPRITE_MANIFEST.md
          git commit -m 'art: persist strict Pollinations building candidate'
          git pull --rebase origin main
          git push
      - name: Upload candidate and QA evidence only
        uses: actions/upload-artifact@v4
        with:
          name: pollinations-building-candidate
          path: |
            ${{ steps.target.outputs.file }}
            app/src/main/res/drawable-nodpi/${{ steps.target.outputs.stem }}.webp
            art/production/pollinations-report.json
            art/production/pollinations-qa.json
            art/production/pollinations-contact-sheet.png
          if-no-files-found: error
          retention-days: 14
