name: ChatGPT Original Character Candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/chatgpt-original-trigger.txt'
      - 'tools/sprites/render_chatgpt_originals.py'
      - 'tools/sprites/local_character_material_finish.py'
      - 'tools/sprites/local_character_action_fx.py'
      - 'tools/sprites/local_character_contact_gait.py'
      - 'tools/sprites/render_original_character_previews.py'
      - 'tools/sprites/build_original_offline_review.py'
      - 'tools/sprites/audit_chatgpt_originals.py'

permissions:
  contents: write

concurrency:
  group: chatgpt-original-character-candidates
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Install reproducible local renderer
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - name: Verify editable original art source
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source=Path('tools/sprites/render_chatgpt_originals.py')
          if not source.is_file():
              raise SystemExit('Editable original character renderer is missing from main')
          data=source.read_bytes()
          compile(data,str(source),'exec')
          print('CHATGPT_ORIGINAL_RENDERER_SHA256='+hashlib.sha256(data).hexdigest())
          print('CHATGPT_ORIGINAL_SOURCE_VERSIONED=1')
          PY
      - name: Verify material finish preserves transparency and exact sprite bounds
        run: |
          python - <<'PY'
          import sys,hashlib
          from PIL import Image,ImageDraw
          sys.path.insert(0,'tools/sprites')
          from local_character_material_finish import finish_frame
          original=Image.new('RGBA',(256,256))
          d=ImageDraw.Draw(original)
          d.ellipse((70,20,181,240),fill=(112,130,146,220))
          first=finish_frame(original)
          second=finish_frame(original)
          assert first.getchannel('A').tobytes()==original.getchannel('A').tobytes()
          assert first.tobytes()==second.tobytes()
          assert first.getbbox()==original.getbbox()
          assert first.getpixel((0,0))[3]==0
          assert first.getpixel((120,100))[:3]!=original.getpixel((120,100))[:3]
          print('LOCAL_MATERIAL_FINISH_ALPHA_AND_DETERMINISM_PASS=1')
          PY
      - name: Validate contact-attached action effects before rasterization
        run: |
          python -m unittest discover -s tools/sprites -p 'test_local_character_action_fx.py' -v
      - name: Verify planted-foot motion and phase-continuous boot geometry
        run: python -m unittest discover -s tools/sprites -p 'test_local_character_contact_gait.py' -v
      - name: Render all remaining role families from committed source
        run: |
          python tools/sprites/render_chatgpt_originals.py \
            --output-dir art/incoming/chatgpt-original \
            --save-svg
      - name: Check each candidate atlas without strict promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path('art/incoming/chatgpt-original')
          report=json.loads((base/'creation-manifest.json').read_text())
          required={f'CHR-{r}-{a}' for r in ('OP','LOG','ENG')
                    for a in ('IDLE','WALK','WORK','CARRY','REPAIR','CELEB')}
          assert report['review_only'] and report['strict_done_added']==0
          assert {a['id'] for a in report['assets']}==required
          assert report['asset_count']==18 and report['unresolved_target_count']==16
          # Every unfinished character must have an original, reproducible
          # candidate authored in this repository, not only a remote GPU file.
          master=json.loads(Path('art/production/master-asset-queue.json').read_text())
          unfinished={a['id'] for a in master['assets']
                      if a.get('strict_status')!='DONE' and a['id'].startswith('CHR-')}
          if not unfinished.issubset(required):
              raise SystemExit('Unfinished characters without local-first art: '
                               +str(sorted(unfinished-required)))
          if not unfinished.issubset({a['id'] for a in report['assets']}):
              raise SystemExit('Unfinished characters missing from local creation manifest')
          proof=[]
          editable_svg_count=0
          for a in report['assets']:
              p=base/'candidates'/a['file']
              with Image.open(p) as im:
                  assert im.size==(1024,1024) and im.mode=='RGBA',a['id']
                  for f in range(a['frames']):
                      cell=im.crop(((f%4)*256,(f//4)*256,(f%4+1)*256,(f//4+1)*256))
                      box=cell.getchannel('A').getbbox()
                      assert box is not None, (a['id'],'empty',f)
                      assert box[0]>=10 and box[1]>=10 and box[2]<=246 and box[3]<=246,(a['id'],'cropped',f,box)
              for f in range(a['frames']):
                  editable=base/'src_svg'/a['role']/a['action']/f'{f:02d}.svg'
                  assert editable.is_file(),(a['id'],'missing-editable-frame-svg',f)
                  import xml.etree.ElementTree as ET
                  root=ET.parse(editable).getroot()
                  assert root.tag=='{http://www.w3.org/2000/svg}svg',editable
                  editable_svg_count+=1
              proof.append({'id':a['id'],'frames':a['frames'],'technical_geometry_pass':True,
                            'semantic_approved':False,'android_validated':False,'strict_done_added':0})
          (base/'candidate-qa.json').write_text(json.dumps({'review_only':True,'assets':proof},indent=2)+'\n')
          assert editable_svg_count==150,editable_svg_count
          print('CHATGPT_ORIGINAL_EDITABLE_SVG_FRAMES='+str(editable_svg_count))
          print('CHATGPT_ORIGINAL_ASSET_QA_PASS='+str(len(proof)))
          PY
      - name: Render animated previews and technical motion evidence
        run: |
          python tools/sprites/render_original_character_previews.py \
            --output-dir art/incoming/chatgpt-original
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('art/incoming/chatgpt-original')
          d=json.loads((p/'animation-review.json').read_text())
          assert d['review_only'] is True and d['strict_done_added']==0
          assert d['generated_local_preview_count']==18
          assert d['mobile_role_review_board_count']==3
          for role in ('op','log','eng'):
              with Image.open(p/'previews'/f'mobile-{role}.png') as board:
                  assert board.size==(430,6*132),(role,board.size)
          assert d['editable_source_frame_count']==150
          assert len(d['assets'])==18
          for item in d['assets']:
              assert item['distinct_frame_hashes']>1,item['id']
              assert item['min_alpha_margin']>=10,item['id']
              assert item['last_to_first_loop_activity']>=0,item['id']
              assert item['loop_seam_to_median_ratio']>=0,item['id']
              assert item['abrupt_loop_reset_risk'] is False,(
                  item['id'],'abrupt-animation-loop-reset',
                  item['loop_seam_to_median_ratio'])
              with Image.open(p/item['animation_preview']) as preview:
                  assert preview.format=='GIF'
                  # GIF encoders coalesce identical consecutive poses and
                  # retain their total duration. The 1024px RGBA source atlas
                  # still owns the exact canonical frame count.
                  assert 2<=preview.n_frames<=item['frames'],(item['id'],preview.n_frames)
          assert (p/'original-review-contact-sheet.png').is_file()
          print('CHATGPT_ANIMATED_MOBILE_PREVIEWS_PASS=18')
          PY
      - name: Build self-contained Android-friendly offline original art reviewer
        run: |
          python tools/sprites/build_original_offline_review.py \
            --source art/incoming/chatgpt-original \
            --output art/incoming/chatgpt-original/original-offline-review.html
          python - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('art/incoming/chatgpt-original/original-offline-review.html').read_text()
          assert html.startswith('<!doctype html>')
          match=re.search(r'<script type="application/json" id="embedded">(.*?)</script>',html,re.S)
          assert match,'Missing standalone embedded original role assets'
          d=json.loads(match.group(1))
          assert len(d)==18
          assert sum(item['count'] for item in d.values())==150
          assert all(item['atlas'].startswith('data:image/png;base64,')
                     and item['animation'].startswith('data:image/gif;base64,')
                     for item in d.values())
          assert 'Aucun changement automatique du compteur strict' in html
          print('OFFLINE_ORIGINAL_REVIEW_PASS=18')
          PY
      - name: Report all remaining character motion and identity risks without approval
        run: |
          python tools/sprites/audit_chatgpt_originals.py \
            --base art/incoming/chatgpt-original
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/incoming/chatgpt-original/visual-risk-qa.json')
          d=json.loads(p.read_text())
          assert d['review_only'] is True and d['automatic_strict_done']==0
          assert d['asset_count']==18 and d['frames_checked']==150
          assert len(d['assets'])==18
          assert all(not r['image_only_semantic_approval'] for r in d['assets'])
          # Reject-only cross-action reference evidence: every local action
          # must be compared to the same role's authored IDLE headgear.
          assert all(isinstance(r['same_role_idle_head_color_distance'],(float,int))
                     for r in d['assets'])
          assert all(r['same_role_idle_head_color_distance']==0
                     for r in d['assets'] if r['id'].endswith('-IDLE'))
          print('CHATGPT_ORIGINAL_CROSS_ACTION_IDENTITY_EVIDENCE=18')
          print('CHATGPT_ORIGINAL_REJECT_ONLY_VISUAL_QA_PASS=18')
          PY
      - name: Publish original candidate review evidence
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-original-character-atlases
          path: |
            art/incoming/chatgpt-original/candidates/*.png
            art/incoming/chatgpt-original/src_svg/**/*.svg
            art/incoming/chatgpt-original/previews/*.gif
            art/incoming/chatgpt-original/previews/mobile-*.png
            art/incoming/chatgpt-original/original-review-contact-sheet.png
            art/incoming/chatgpt-original/original-offline-review.html
            art/incoming/chatgpt-original/animation-review.json
            art/incoming/chatgpt-original/creation-manifest.json
            art/incoming/chatgpt-original/candidate-qa.json
            art/incoming/chatgpt-original/visual-risk-qa.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit original atlas candidates and readable source to repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f tools/sprites/render_chatgpt_originals.py
          git add -f art/incoming/chatgpt-original/
          git rm -f --ignore-unmatch ops/chatgpt-original-renderer.zlib.b64
          if git diff --cached --quiet; then
            echo 'CHATGPT_ORIGINAL_ATLASES_UNCHANGED=1'
            exit 0
          fi
          git commit -m 'art(candidate): update 18 original character atlases made in ChatGPT'
          git pull --rebase origin main
          git push origin HEAD:main
