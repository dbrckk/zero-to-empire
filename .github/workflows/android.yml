name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'art/production/**'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'art/production/**'
      - 'docs/art/FINAL_AAA_SPRITE_MANIFEST.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Detect sprite-only runtime update
        id: change_scope
        shell: bash
        run: |
          set -euo pipefail
          sprite_only=false
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
            printf 'changed files:\n%s\n' "${changed[*]}"
            if (( ${#changed[@]} > 0 )); then
              sprite_only=true
              for file in "${changed[@]}"; do
                case "$file" in
                  app/src/main/res/drawable-nodpi/*_final.webp|app/src/main/res/drawable-nodpi/*_final.png) ;;
                  *) sprite_only=false; break ;;
                esac
              done
            fi
          fi
          echo "sprite_only=${sprite_only}" >> "$GITHUB_OUTPUT"
          echo "sprite_only=${sprite_only}"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      - name: Verify Gradle toolchain
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        if: steps.change_scope.outputs.sprite_only != 'true'
        run: gradle testDebugUnitTest --stacktrace

      - name: Run lint
        if: steps.change_scope.outputs.sprite_only != 'true'
        run: gradle lintDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
