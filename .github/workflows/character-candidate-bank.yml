name: Assemble Character Candidate Bank

on:
  workflow_run:
    workflows: [Archive Character Candidates, ChatGPT Original Character Candidates]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/character-candidate-bank.yml'
      - 'art/production/master-asset-queue.json'
      - 'art/incoming/chatgpt-original/candidates/**'
      - 'art/incoming/chatgpt-original/src_svg/**'
      - 'art/incoming/chatgpt-original/creation-manifest.json'
      - 'art/incoming/chatgpt-original/candidate-qa.json'
      - 'tools/sprites/build_character_candidate_bank.py'
      - 'tools/sprites/build_character_bank_mobile_review.py'
      - 'tools/sprites/audit_character_bank_motion.py'
      - 'tools/sprites/build_character_role_contact_sheet.py'
      - 'tools/sprites/build_character_mobile_motion_storyboard.py'
      - 'tools/sprites/build_character_identity_polish.py'
      - 'tools/sprites/character_identity_polish_mobile_review.py'
      - 'tools/sprites/character_head_identity_lock.py'
      - 'tools/sprites/tests/test_character_*'

permissions:
  contents: write
  actions: read

concurrency:
  group: zte-character-candidate-bank
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: zte-character-candidates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Test exact-source candidate selection
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -m unittest discover -s tools/sprites/tests -p test_character_candidate_bank.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_bank_mobile_review.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_bank_motion_audit.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_role_contact_sheet.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_mobile_motion_storyboard.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_identity_polish.py -v
          python -m unittest discover -s tools/sprites/tests -p test_character_identity_polish_mobile_review.py -v
          python -m py_compile tools/sprites/build_character_candidate_bank.py tools/sprites/build_character_bank_mobile_review.py tools/sprites/audit_character_bank_motion.py tools/sprites/build_character_role_contact_sheet.py tools/sprites/build_character_mobile_motion_storyboard.py tools/sprites/build_character_identity_polish.py tools/sprites/character_identity_polish_mobile_review.py

      - name: Download current permanent candidate archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zte-review-archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'zte-characters-*.zip' \
            --dir /tmp/zte-review-archives
          ls -lh /tmp/zte-review-archives/zte-characters-*.zip

      - name: Assemble canonical character bank
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_candidate_bank.py \
            --master art/production/master-asset-queue.json \
            --archives /tmp/zte-review-archives \
            --local-original art/incoming/chatgpt-original \
            --output /tmp/zte-character-bank-current.zip \
            --report /tmp/zte-character-bank-current.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/zte-character-bank-current.json'))
          print('## Character candidate bank')
          print(f"- Verified candidate coverage (including local originals): **{d['production_processed']} / {d['target_total']}**")
          print(f"- Canonical production queue processed: **{d['canonical_queue_production_processed']} / {d['target_total']}**")
          print(f"- Strict DONE: **{d['strict_done']} / {d['target_total']}** (unchanged)")
          print(f"- Provisional character sprites in bank: **{d['candidate_count']}**")
          print(f"- Original in-repository fallbacks: **{len(d['local_original_fallback_ids'])}**")
          print(f"- Local fallback IDs: {', '.join(d['local_original_fallback_ids']) or 'none'}")
          print(f"- Production candidate complete: **{d['candidate_production_complete']}**")
          if d['missing_character_candidates']:
              print("- Remaining: "+", ".join(x['id'] for x in d['missing_character_candidates']))
          print('- These are review-only source sprites, not approved Android resources.')
          PY

      - name: Audit animation readability at actual 42px gameplay size
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/audit_character_bank_motion.py \
            --bank /tmp/zte-character-bank-current.zip \
            --output /tmp/zte-character-bank-motion-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('/tmp/zte-character-bank-motion-audit.json'))
          print('## Motion readability review (heuristic only)')
          print(f"- Screen size: **{data['mobile_render_px']} px**")
          print(f"- Candidate actions flagged: **{data['motion_attention_count']} / {data['candidate_count']}**")
          print(f"- Cross-action head identity deviations: **{data['identity_attention_count']} / {data['candidate_count']}**")
          for row in data['assets']:
              if row['new_motion_flags']:
                  print(f"- {row['id']}: {', '.join(row['new_motion_flags'])}")
              if row['new_identity_flags']:
                  reference=row['head_identity_metrics']['reference_id']
                  distance=row['head_identity_metrics']['mean_head_rgb_change']
                  print(f"- {row['id']} vs {reference}: head RGB deviation {distance:.2f}; "+', '.join(row['new_identity_flags']))
          print('- No flags represent automatic semantic approval.')
          PY

      - name: Build a separate coherent engineer role alternative with all six local vector actions
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_candidate_bank.py \
            --master art/production/master-asset-queue.json \
            --archives /tmp/zte-review-archives \
            --local-original art/incoming/chatgpt-original \
            --engineer-role-coherent-review \
            --output /tmp/zte-character-eng-role-review-current.zip \
            --report /tmp/zte-character-eng-role-review-current.json
          python tools/sprites/audit_character_bank_motion.py \
            --bank /tmp/zte-character-eng-role-review-current.zip \
            --output /tmp/zte-character-eng-role-review-motion-audit.json
          python tools/sprites/build_character_mobile_motion_storyboard.py \
            --bank /tmp/zte-character-eng-role-review-current.zip \
            --audit /tmp/zte-character-eng-role-review-motion-audit.json \
            --output /tmp/zte-character-eng-role-review-motion-storyboard.png
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          root='/tmp/'
          canonical=json.load(open(root+'zte-character-bank-current.json'))
          alternate=json.load(open(root+'zte-character-eng-role-review-current.json'))
          baseline=json.load(open(root+'zte-character-bank-motion-audit.json'))
          review=json.load(open(root+'zte-character-eng-role-review-motion-audit.json'))
          expected={'CHR-ENG-'+action for action in ('IDLE','WALK','WORK','CARRY','REPAIR','CELEB')}
          assert alternate['source_selection_profile']=='engineer-local-role-review'
          assert set(alternate['local_original_preferred_ids'])==expected
          assert alternate['candidate_count']==canonical['candidate_count']
          assert alternate['strict_done']==canonical['strict_done']
          assert alternate['automatic_semantic_approval'] is False
          assert alternate['automatic_runtime_promotion'] is False
          by_id={row['id']:row for row in review['assets']}
          before={row['id']:row for row in baseline['assets']}
          assert all(not by_id[key]['new_identity_flags'] for key in expected)
          base_walk=before['CHR-ENG-WALK']['motion_metrics']['mean_frame_change']
          local_walk=by_id['CHR-ENG-WALK']['motion_metrics']['mean_frame_change']
          assert local_walk>=0.012 and local_walk>=base_walk*1.25, (
              'Engineer local gait was not measurably better at 42px',base_walk,local_walk)
          print('## Separate coherent engineer role (review only)')
          print(f'- All **6 ENG actions** use one edited local vector character; other roles retain canonical sources')
          print(f'- ENG WALK 42px mean frame change: **{base_walk:.5f} → {local_walk:.5f}**')
          print('- ENG identity deviations in local candidate cohort: **0** (heuristic)')
          for action in ('WORK','REPAIR'):
              name='CHR-ENG-'+action
              old=before[name]['motion_metrics']['mean_frame_change']
              new=by_id[name]['motion_metrics']['mean_frame_change']
              print(f'- ENG {action} motion: {old:.5f} → {new:.5f}; manual review still required')
          print('- Canonical bank and runtime remain unchanged; strict DONE unchanged.')
          PY

      - name: Produce safe alternative head and helmet atlases for artistic review
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_identity_polish.py \
            --bank /tmp/zte-character-bank-current.zip \
            --audit /tmp/zte-character-bank-motion-audit.json \
            --output /tmp/zte-character-identity-polish-current.zip \
            --report /tmp/zte-character-identity-polish-current.json \
            --comparison /tmp/zte-character-identity-polish-preview.png \
            --mobile-review /tmp/zte-character-identity-polish-mobile-review.html
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/zte-character-identity-polish-current.json'))
          print('## Same-role face/helmet polish proposals (review-only)')
          print(f"- Identity warnings: **{d['identity_flags_to_review']}**")
          print(f"- Fully safe multi-frame alternatives: **{d['alternatives_created']}**")
          print(f"- 42px motion regression warnings after retouch: **{d['mobile_motion_regression_review_count']}**")
          for row in d['alternatives']:
              if row['mobile_motion_regression_review']:
                  print(f"- Motion review: {row['id']}: {row['mobile_motion_before']['mean_frame_change']:.5f} → {row['mobile_motion_after']['mean_frame_change']:.5f}")
          for row in d['alternatives']:
              print(f"- {row['id']}: {row['head_rgb_before']:.2f} → {row['head_rgb_after']:.2f} mean head RGB change; {row['frames_head_locked']}/{row['frames']} frames corrected")
          for row in d['not_safe_to_polish']:
              print(f"- Not modified: {row['id']}: {row['reason']}")
          print('- These alternative PNGs do **not** replace canonical bank, Android files, strict DONE or human approval.')
          PY

      - name: Build one-page character identity contact sheet for Android
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_role_contact_sheet.py \
            --bank /tmp/zte-character-bank-current.zip \
            --audit /tmp/zte-character-bank-motion-audit.json \
            --output /tmp/zte-character-bank-role-consistency.png
          test -s /tmp/zte-character-bank-role-consistency.png
          echo "MOBILE_IDENTITY_CONTACT_SHEET=review-only/OP-LOG-ENG" >> "$GITHUB_STEP_SUMMARY"

      - name: Render actual 42px animation storyboard for day and night
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_mobile_motion_storyboard.py \
            --bank /tmp/zte-character-bank-current.zip \
            --audit /tmp/zte-character-bank-motion-audit.json \
            --output /tmp/zte-character-bank-motion-storyboard.png
          test -s /tmp/zte-character-bank-motion-storyboard.png
          echo "MOBILE_GAMEPLAY_STORYBOARD=42px-day-night/review-only" >> "$GITHUB_STEP_SUMMARY"

      - name: Create self-contained mobile animation comparison
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprites/build_character_bank_mobile_review.py \
            --bank /tmp/zte-character-bank-current.zip \
            --local-original art/incoming/chatgpt-original \
            --motion-audit /tmp/zte-character-bank-motion-audit.json \
            --output /tmp/zte-character-bank-mobile-review.html
          test -s /tmp/zte-character-bank-mobile-review.html
          echo "MOBILE_CANDIDATE_REVIEW=offline/16-candidate-compare" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish persistent source bank
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            /tmp/zte-character-bank-current.zip \
            /tmp/zte-character-bank-current.json \
            /tmp/zte-character-bank-motion-audit.json \
            /tmp/zte-character-identity-polish-current.zip \
            /tmp/zte-character-identity-polish-current.json \
            /tmp/zte-character-identity-polish-preview.png \
            /tmp/zte-character-identity-polish-mobile-review.html \
            /tmp/zte-character-bank-role-consistency.png \
            /tmp/zte-character-bank-motion-storyboard.png \
            /tmp/zte-character-bank-mobile-review.html \
            /tmp/zte-character-eng-role-review-current.zip \
            /tmp/zte-character-eng-role-review-current.json \
            /tmp/zte-character-eng-role-review-motion-audit.json \
            /tmp/zte-character-eng-role-review-motion-storyboard.png \
            --repo "$GITHUB_REPOSITORY" --clobber
          sha256sum /tmp/zte-character-bank-current.zip >> "$GITHUB_STEP_SUMMARY"
          echo "CHARACTER_CANDIDATE_BANK_RELEASE=$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain workflow output
        uses: actions/upload-artifact@v4
        with:
          name: current-character-candidate-bank
          path: |
            /tmp/zte-character-bank-current.zip
            /tmp/zte-character-bank-current.json
            /tmp/zte-character-bank-motion-audit.json
            /tmp/zte-character-identity-polish-current.zip
            /tmp/zte-character-identity-polish-current.json
            /tmp/zte-character-identity-polish-preview.png
            /tmp/zte-character-identity-polish-mobile-review.html
            /tmp/zte-character-bank-role-consistency.png
            /tmp/zte-character-bank-motion-storyboard.png
            /tmp/zte-character-bank-mobile-review.html
            /tmp/zte-character-eng-role-review-current.zip
            /tmp/zte-character-eng-role-review-current.json
            /tmp/zte-character-eng-role-review-motion-audit.json
            /tmp/zte-character-eng-role-review-motion-storyboard.png
          retention-days: 30
