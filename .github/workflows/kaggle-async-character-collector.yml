name: Kaggle Async Character Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/kaggle-collector-trigger.txt'

permissions:
  contents: write
  actions: write

# A scheduled check must never cancel a collector while it is downloading
# and reconciling a finished GPU batch. Queue the next check instead.
concurrency:
  group: kaggle-async-character-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Sync canonical main
        run: git pull --ff-only origin main
      - name: Check active async wave
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('art/production/kaggle-async-state.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          from datetime import datetime, timezone
          active=str(d.get('status','')).upper()=='ACTIVE'
          submitted=str(d.get('submitted_at',''))
          # Full 12-sheet bursts need roughly twice the compute of a six-action
          # role. Do not cancel a healthy RUNNING GPU merely because the older
          # six-action fixed timeout (150 min) has elapsed.
          target_count=len(d.get('target_ids') or [])
          stale_limit_minutes=360 if target_count >= 10 else 210
          stale=False
          if active and submitted:
              try:
                  ts=datetime.fromisoformat(submitted.replace('Z','+00:00'))
                  stale=(datetime.now(timezone.utc)-ts).total_seconds() > stale_limit_minutes*60
              except (ValueError, TypeError):
                  stale=False
          print('stale_limit_minutes='+str(stale_limit_minutes))
          print('active='+str(active).lower())
          print('dispatch_token='+str(d.get('dispatch_token','')))
          print('submit_run_id='+str(d.get('submit_run_id','')))
          print('kernel_slug='+str(d.get('kernel_slug') or 'zero-to-empire-sprite-factory'))
          print('stale='+str(stale).lower())
          PY
      - name: Install Kaggle CLI
        if: steps.gate.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check --upgrade kaggle 'Pillow<12'
      - name: Check Kaggle kernel state
        if: steps.gate.outputs.active == 'true'
        id: kernel
        shell: bash
        run: |
          set -euo pipefail
          slug="${KAGGLE_USERNAME}/${{ steps.gate.outputs.kernel_slug }}"
          status="$(kaggle kernels status "$slug" 2>&1 || true)"
          printf '%s\n' "$status" | tee /tmp/kaggle-kernel-status.txt
          if echo "$status" | grep -qi 'complete'; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$status" | grep -Eqi 'error|cancel|failed'; then
            echo 'failed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.gate.outputs.stale }}" = true ] && echo "$status" | grep -Eqi 'RUNNING|QUEUED'; then
            echo 'failed=true' >> "$GITHUB_OUTPUT"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'KAGGLE_ASYNC_STALE=1'
            exit 0
          fi
          echo 'ready=false' >> "$GITHUB_OUTPUT"
      - name: Upload kernel observation
        if: steps.gate.outputs.active == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-async-kernel-observation-${{ steps.gate.outputs.submit_run_id }}
          path: /tmp/kaggle-kernel-status.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Download completed output
        if: steps.kernel.outputs.ready == 'true'
        run: |
          rm -rf /tmp/kaggle-output
          mkdir -p /tmp/kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/${{ steps.gate.outputs.kernel_slug }}" -p /tmp/kaggle-output --force
          find /tmp/kaggle-output/output -maxdepth 3 -type f -print
      - name: Verify expected async targets
        if: steps.kernel.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('art/production/kaggle-async-state.json').read_text())
          generated=Path('/tmp/kaggle-output/output/generated-targets.json')
          if not generated.exists(): raise SystemExit('generated-targets.json missing')
          g=json.loads(generated.read_text())
          if g.get('lane')!='CONTROLLED_CHARACTER_SHEETS': raise SystemExit('unexpected Kaggle lane')
          expected=set(state.get('target_ids',[]))
          actual={str(x.get('id','')).upper() for x in g.get('targets',[]) if x.get('id')}
          report_path=Path('/tmp/kaggle-output/output/character-sheet-report.json')
          if report_path.exists():
              report=json.loads(report_path.read_text())
              actual.update(str(r.get('id','')).upper() for r in report if r.get('id'))
          missing=expected-actual
          if missing:
              raise SystemExit(
                  f'incomplete/stale Kaggle output missing={sorted(missing)} '
                  f'expected={sorted(expected)} actual={sorted(actual)}'
              )
          print('KAGGLE_ASYNC_MATCH='+','.join(sorted(expected)))
          PY
      - name: Technical QA
        if: steps.kernel.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/kaggle-output/output/candidates/*_final.png)
          if (( ${#files[@]} > 0 )); then
            python tools/sprites/build_sprite_contact_sheet.py               --output /tmp/kaggle-output/output/github-contact-sheet.png               --report /tmp/kaggle-output/output/github-qa-report.json               --files "${files[@]}"
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/kaggle-output/output/github-qa-report.json').read_text())
          rows=d if isinstance(d,list) else d.get('assets',d.get('sprites',d.get('results',[])))
          files={p.name for p in Path('/tmp/kaggle-output/output/candidates').glob('*_final.png')}
          reported=[str(r.get('file') or '') for r in rows]
          if len(reported)!=len(set(reported)) or set(reported)!=files:
              raise SystemExit('incomplete/duplicate technical QA coverage')
          passed=[r for r in rows if r.get('pass') is True]
          failed=[r for r in rows if r.get('pass') is not True]
          # Do not lose nine valid actions because one of twelve failed QA.
          # Failed sprites are carried to controlled state as specific rejects,
          # never as AWAITING_REVIEW candidates.
          print('KAGGLE_ASYNC_QA_PASS='+str(len(passed)))
          print('KAGGLE_ASYNC_QA_REJECT='+str(len(failed)))
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/kaggle-output/output/character-sheet-report.json').read_text())
          attempted=[r for r in rows if r.get('id')]
          rejected=[r for r in attempted if str(r.get('status','')).upper()=='REJECT']
          if not attempted or len(rejected)!=len(attempted):
              raise SystemExit('no candidates and incomplete rejection report')
          print('KAGGLE_ASYNC_CLEAN_REJECT_BATCH='+str(len(rejected)))
          PY
          fi
      - name: Build full-frame role review panels
        if: steps.kernel.outputs.ready == 'true'
        run: |
          python tools/sprites/build_character_review_panels.py \
            --candidates /tmp/kaggle-output/output/candidates \
            --qa-report /tmp/kaggle-output/output/github-qa-report.json \
            --output-dir /tmp/kaggle-output/output/review-panels
      - name: Reconcile controlled character queue
        if: steps.kernel.outputs.ready == 'true'
        env:
          SUBMIT_RUN_ID: ${{ steps.gate.outputs.submit_run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          generated=json.loads(Path('/tmp/kaggle-output/output/generated-targets.json').read_text())
          report_path=Path('/tmp/kaggle-output/output/character-sheet-report.json')
          report=json.loads(report_path.read_text()) if report_path.exists() else []
          manifest=Path('docs/art/FINAL_AAA_SPRITE_MANIFEST.md')
          stem_to_id={}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.startswith('|') or 'CHR-' not in line or 'app/src/main/res/' not in line: continue
              cols=[x.strip() for x in line.split('|')[1:-1]]
              if len(cols)==5: stem_to_id[Path(cols[3].replace(chr(96),'')).stem]=cols[0]
          produced={stem_to_id.get(Path(x['file']).stem) for x in generated.get('targets',[]) if x.get('file')}
          candidate_dir=Path('/tmp/kaggle-output/output/candidates')
          if candidate_dir.is_dir():
              produced.update(stem_to_id.get(p.stem) for p in candidate_dir.glob('*_final.png'))
          produced.discard(None)
          rejected={}
          qa_path=Path('/tmp/kaggle-output/output/github-qa-report.json')
          if qa_path.exists():
              qa=json.loads(qa_path.read_text())
              qa_rows=qa if isinstance(qa,list) else qa.get('assets',qa.get('sprites',qa.get('results',[])))
              for row in qa_rows:
                  if row.get('pass') is True:
                      continue
                  aid=stem_to_id.get(Path(str(row.get('file') or '')).stem)
                  if not aid:
                      raise SystemExit('Unmapped rejected QA candidate: '+str(row.get('file')))
                  produced.discard(aid)
                  rejected[aid]='technical-qa:'+','.join(str(x) for x in row.get('issues',[]) or ['unknown'])
          for row in report:
              if str(row.get('status','')).upper()!='REJECT':
                  continue
              aid=str(row.get('id','')).upper()
              reason=str(row.get('reason') or 'generator rejection')
              retries=[str(x) for x in row.get('retry_reasons',[]) if str(x).strip()]
              if retries:
                  reason += '; retry-details=' + ' | '.join(dict.fromkeys(retries[-4:]))
              if aid not in produced and aid not in rejected:
                  rejected[aid]=reason
          p=Path('art/production/controlled-character-regen-queue.json')
          q=json.loads(p.read_text())
          run_id=int(os.environ.get('SUBMIT_RUN_ID') or 0)
          for item in q.get('targets',[]):
              aid=str(item.get('id','')).upper()
              if str(item.get('status','')).upper()!='PENDING_KAGGLE': continue
              if aid in produced:
                  item['status']='AWAITING_REVIEW'
                  item['kaggle_run_id']=run_id
                  item['review_artifact_run_id']=int(os.environ['GITHUB_RUN_ID'])
                  item.pop('review_reason',None)
              elif aid in rejected:
                  item['status']='REJECTED'
                  item['kaggle_run_id']=run_id
                  item['review_artifact_run_id']=int(os.environ['GITHUB_RUN_ID'])
                  item['review_reason']='Kaggle generator rejected candidate: '+rejected[aid]
          p.write_text(json.dumps(q,indent=2)+'\n')
          state=Path('art/production/kaggle-async-state.json')
          d=json.loads(state.read_text()); d['status']='COLLECTED'; d['collector_run_id']=int(os.environ['GITHUB_RUN_ID'])
          state.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/production/controlled-character-regen-queue.json art/production/kaggle-async-state.json
          git commit -m 'art(auto): collect async Kaggle character wave'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Callback autofactory success
        if: steps.kernel.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 'Asset Autofactory 235' --ref main             -f producer_workflow='Kaggle Mass Sprite Factory'             -f producer_conclusion='success'             -f producer_run_id='${{ steps.gate.outputs.submit_run_id }}'             -f producer_dispatch_token='${{ steps.gate.outputs.dispatch_token }}'
      - name: Download failed kernel evidence
        if: ${{ steps.kernel.outputs.failed == 'true' || (steps.kernel.outputs.ready == 'true' && failure()) }}
        shell: bash
        run: |
          set +e
          rm -rf /tmp/kaggle-failure
          mkdir -p /tmp/kaggle-failure
          slug="${KAGGLE_USERNAME}/${{ steps.gate.outputs.kernel_slug }}"
          kaggle kernels output "$slug" -p /tmp/kaggle-failure --force > /tmp/kaggle-failure/download.log 2>&1
          rc=$?
          printf 'KAGGLE_FAILURE_OUTPUT_RC=%s\n' "$rc" | tee -a /tmp/kaggle-failure/download.log
          kaggle kernels status "$slug" > /tmp/kaggle-failure/status.log 2>&1 || true
          find /tmp/kaggle-failure -maxdepth 5 -type f -print
          exit 0
      - name: Upload failed kernel evidence
        if: ${{ steps.kernel.outputs.failed == 'true' || (steps.kernel.outputs.ready == 'true' && failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-async-failure-evidence-${{ steps.gate.outputs.submit_run_id }}
          path: /tmp/kaggle-failure/**
          if-no-files-found: warn
          retention-days: 30
      - name: Callback autofactory failure
        if: ${{ steps.kernel.outputs.failed == 'true' || (steps.kernel.outputs.ready == 'true' && failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/production/kaggle-async-state.json')
          d=json.loads(p.read_text()); d['status']='FAILED_STALE' if '${{ steps.kernel.outputs.stale }}' == 'true' else 'FAILED'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/production/kaggle-async-state.json
          git commit -m 'art(auto): mark async Kaggle wave failed'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run 'Asset Autofactory 235' --ref main             -f producer_workflow='Kaggle Mass Sprite Factory'             -f producer_conclusion='failure'             -f producer_run_id='${{ steps.gate.outputs.submit_run_id }}'             -f producer_dispatch_token='${{ steps.gate.outputs.dispatch_token }}'
      - name: Upload collected evidence
        if: steps.kernel.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-async-character-batch
          path: /tmp/kaggle-output/**
          if-no-files-found: warn
          retention-days: 90
